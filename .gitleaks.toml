title = "GoreeCloud Glaze UI secret-scan classification"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Glaze optical token metadata: inherited design-token labels are not API credentials."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tokens/glaze-v1\.4-optical-material\.candidate\.json$''']
regexTarget = "line"
regexes = [
  '''"cornerRadiusToken"\s*:\s*"inherited-v1\.3"''',
  '''"motionProfile"\s*:\s*"inherited-v1\.3"'''
]

[[allowlists]]
description = "Glaze V1.2 shared geometry token is a CSS/design token, not an API credential."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^contracts/v1\.2/artwork-imagery\.candidate\.json$''']
regexTarget = "line"
regexes = [
  '''"cornerRadiusToken"\s*:\s*"--glz12-radius-surface"'''
]

[[allowlists]]
description = "Historical release record contains a public Git commit SHA adjacent to Cloudflare Pages prose, not a Cloudflare credential."
targetRules = ["cloudflare-api-key"]
condition = "AND"
paths = ['''^acceptance/2\.2-stable\.md$''']
regexTarget = "match"
regexes = [
  '''fb5ecde4a8258503789ffde08ac46a2e524ef71e'''
]
