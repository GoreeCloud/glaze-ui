<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glaze UI 2.2 Candidate — Adaptive Foundation Acceptance</title>
  <link rel="stylesheet" href="../css/glaze-2.2.components.adaptive.candidate.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:var(--glz22-canvas);color:var(--glz22-text-primary);font-family:system-ui,sans-serif}.page{padding:16px;display:grid;gap:16px;max-width:760px;margin:auto}.surface{padding:16px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.field{max-width:420px}#result{position:fixed;inset:8px 8px auto;opacity:.02;pointer-events:none;background:#111;color:#fff;padding:8px;font:11px monospace}#result[data-status="fail"]{opacity:.98;background:#7a1616}
  </style>
</head>
<body>
  <main class="page">
    <section class="surface glz22-application">
      <h1 style="margin-top:0">Adaptive input targets</h1>
      <div class="row">
        <button class="glz22-button" data-size="xs" data-variant="primary" id="xs-button">Create</button>
        <button class="glz22-icon-button" data-size="xs" data-variant="glaze" id="xs-icon" aria-label="More actions" title="More actions">•••</button>
      </div>
      <label class="glz22-field field" for="adaptive-name" style="margin-top:16px">
        <span class="glz22-field-label">Workspace name</span>
        <span class="glz22-field-control" data-size="sm" data-variant="glaze" id="adaptive-field"><input id="adaptive-name" value="Localized workspace name"></span>
        <span class="glz22-field-message">Touch targets adapt independently from compact visual metrics.</span>
      </label>
      <label class="glz22-field field" for="adaptive-select" style="margin-top:16px">
        <span class="glz22-field-label">Access</span>
        <select class="glz22-select" data-size="sm" data-variant="glaze" id="adaptive-select"><option>Private</option><option>Team</option></select>
      </label>
    </section>
  </main>
  <pre id="result" data-status="pending">PENDING</pre>
  <script>
    (()=>{
      const p=new URLSearchParams(location.search), mode=p.get('mode')||'touch', root=document.documentElement;
      root.dataset.mode=mode;
      root.dataset.glzInput=p.get('input')||'touch';
      if(mode==='touch-assistance') root.dataset.glzTouchAssistance='true';
      if(mode==='increased-contrast') root.dataset.mode='increased-contrast';
      if(mode==='reduced-transparency') root.dataset.glzTransparency='reduced';
      const px=v=>Number.parseFloat(v)||0;
      const backdrop=e=>{const s=getComputedStyle(e);return s.backdropFilter||s.webkitBackdropFilter||''};
      addEventListener('load',()=>setTimeout(()=>{
        const failures=[], expected=mode==='touch-assistance'?56:48;
        for(const id of ['xs-button','xs-icon','adaptive-field','adaptive-select']){
          const el=document.getElementById(id), r=el.getBoundingClientRect();
          if(r.height+0.1<expected) failures.push(`${id} height ${r.height.toFixed(1)} < ${expected}`);
          if(id==='xs-icon'&&r.width+0.1<expected) failures.push(`${id} width ${r.width.toFixed(1)} < ${expected}`);
        }
        const button=document.getElementById('xs-button');button.focus();const s=getComputedStyle(button);
        if(document.activeElement!==button||s.outlineStyle==='none'||px(s.outlineWidth)<2) failures.push('adaptive focus ring missing');
        if(mode==='increased-contrast'){
          if(px(getComputedStyle(button).borderTopWidth)<2) failures.push('increased contrast button boundary < 2px');
          if(px(s.outlineWidth)<4) failures.push('increased contrast focus ring < 4px');
        }
        if(mode==='reduced-transparency') for(const id of ['xs-icon','adaptive-field','adaptive-select']){const f=backdrop(document.getElementById(id));if(f&&f!=='none') failures.push(`${id} retained backdrop effect ${f}`)}
        if(document.documentElement.scrollWidth>innerWidth+1) failures.push(`horizontal overflow ${document.documentElement.scrollWidth}>${innerWidth}`);
        const result=document.getElementById('result');result.dataset.status=failures.length?'fail':'pass';result.textContent=failures.length?`FAIL\n${failures.join('\n')}`:`PASS adaptive ${mode} target=${expected}`;
      },40),{once:true});
    })();
  </script>
</body>
</html>
