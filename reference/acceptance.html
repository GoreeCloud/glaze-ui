<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glaze UI rendered acceptance harness</title>
  <style>
    html, body { margin: 0; background: #111; color: #fff; font-family: ui-monospace, monospace; }
    iframe { display: block; border: 0; background: #fff; }
    #result { white-space: pre-wrap; margin: 0; padding: 12px; }
  </style>
</head>
<body>
  <iframe id="target" title="Glaze UI acceptance target"></iframe>
  <pre id="result" data-status="pending">PENDING</pre>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const width = Number(params.get('width') || 390);
      const height = Number(params.get('height') || 844);
      const theme = params.get('theme') || 'light';
      const expectedMode = params.get('mode') || 'normal';
      const frame = document.getElementById('target');
      const result = document.getElementById('result');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;

      const fail = (messages) => {
        result.dataset.status = 'fail';
        result.textContent = `FAIL\n${messages.join('\n')}`;
        document.title = 'FAIL — Glaze UI rendered acceptance';
      };
      const pass = (messages) => {
        result.dataset.status = 'pass';
        result.textContent = `PASS\n${messages.join('\n')}`;
        document.title = 'PASS — Glaze UI rendered acceptance';
      };
      let settled = false;
      const settle = (fn, messages) => { if (settled) return; settled = true; fn(messages); };
      const safetyTimer = setTimeout(() => settle(fail, ['acceptance frame did not finish loading']), 8000);

      frame.addEventListener('load', () => {
        clearTimeout(safetyTimer);
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) return settle(fail, ['frame document unavailable']);
        doc.documentElement.dataset.theme = theme;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const errors = [];
          const notes = [];
          const root = doc.documentElement;
          const body = doc.body;
          const rect = (node) => node.getBoundingClientRect();
          const style = (node) => win.getComputedStyle(node);

          if (win.innerWidth !== width) errors.push(`viewport width ${win.innerWidth} != ${width}`);
          if (root.scrollWidth > root.clientWidth + 1 || body.scrollWidth > body.clientWidth + 1) {
            errors.push(`horizontal overflow root=${root.scrollWidth}/${root.clientWidth} body=${body.scrollWidth}/${body.clientWidth}`);
          }

          const controls = [...doc.querySelectorAll('.theme-group button,.glaze-button,.glaze-icon-button,.glaze-input,.glaze-choice,.glaze-switch,.glaze-segmented [role="tab"],.glaze-nav-item')];
          for (const control of controls) {
            const box = rect(control);
            if (box.width > 0 && box.height > 0 && box.height < 43.5) errors.push(`undersized target ${control.tagName}.${control.className || ''}=${box.height.toFixed(1)}px`);
          }
          notes.push(`checked ${controls.length} interactive targets`);

          const labels = [...doc.querySelectorAll('.glaze-field-label')];
          if (labels.length < 2 || labels.some((label) => rect(label).height <= 0)) errors.push('persistent field labels missing or hidden');
          const invalid = doc.querySelector('#email[aria-invalid="true"]');
          const describedBy = invalid?.getAttribute('aria-describedby');
          if (!invalid || !describedBy || !doc.getElementById(describedBy)) errors.push('field error relationship missing');

          const choice = doc.querySelector('.glaze-choice input[type="checkbox"]');
          const switchInput = doc.querySelector('.glaze-switch input[type="checkbox"]');
          if (!choice?.checked) errors.push('native checkbox selected state missing');
          if (!switchInput?.checked) errors.push('switch checked state missing');

          const selectedTabs = doc.querySelectorAll('.glaze-segmented [role="tab"][aria-selected="true"]');
          if (selectedTabs.length !== 1) errors.push(`segmented selected state count=${selectedTabs.length}`);
          const progress = doc.querySelector('.glaze-progress[role="progressbar"]');
          const progressFill = progress?.querySelector('span');
          if (!progress || progress.getAttribute('aria-valuenow') !== '68' || !progressFill || rect(progressFill).width <= 0) errors.push('determinate progress semantics/rendering missing');
          const banner = doc.querySelector('.glaze-banner[data-state="info"]');
          if (!banner || rect(banner).width <= 0 || rect(banner).height <= 0) errors.push('banner did not render');

          const surfaces = ['.glaze-canvas','.glaze-surface-solid','.glaze-surface-raised','.glaze-surface','.glaze-overlay'];
          for (const selector of surfaces) if (!doc.querySelector(selector)) errors.push(`surface role missing ${selector}`);

          const functionalGlass = doc.querySelector('.glaze-glass-functional');
          const clearGlass = doc.querySelector('.glaze-glass-clear');
          const expressiveAction = doc.querySelector('.glaze-expressive-action');
          const buttonGroup = doc.querySelector('.glaze-button-group');
          const reachLayout = doc.querySelector('.glaze-reach-layout');
          const hero = doc.querySelector('.glaze-hero-type');
          if (!functionalGlass || rect(functionalGlass).width <= 0) errors.push('functional glass did not render');
          if (!clearGlass || rect(clearGlass).width <= 0) errors.push('clear glass did not render');
          if (!expressiveAction || rect(expressiveAction).height < 43.5) errors.push('expressive action missing or undersized');
          if (!buttonGroup || buttonGroup.children.length < 2) errors.push('adaptive button group missing');
          if (!reachLayout) errors.push('compact reachability layout missing');
          if (!hero || rect(hero).height <= 0) errors.push('hero typography missing');

          const shapeClasses = ['.glaze-shape-compact','.glaze-shape-standard','.glaze-shape-expressive','.glaze-shape-hero'];
          for (const selector of shapeClasses) if (!doc.querySelector(selector)) errors.push(`expressive shape role missing ${selector}`);

          if (expectedMode === 'reduced-motion') {
            if (!win.matchMedia('(prefers-reduced-motion: reduce)').matches) errors.push('reduced-motion media mode was not activated');
            if (expressiveAction && style(expressiveAction).transform !== 'none') errors.push('expressive action transformation remains active under reduced motion');
          }
          if (expectedMode === 'forced-colors' && !win.matchMedia('(forced-colors: active)').matches) errors.push('forced-colors media mode was not activated');

          const themeButtons = [...doc.querySelectorAll('[data-theme-choice]')];
          if (themeButtons.length !== 3) errors.push('appearance controls incomplete');
          const themeButton = themeButtons.find((button) => button.dataset.themeChoice === theme);
          if (themeButton) { themeButton.focus(); if (doc.activeElement !== themeButton) errors.push('appearance control cannot receive focus'); }

          notes.push(`viewport ${width}×${height}`);
          notes.push(`theme ${theme}`);
          notes.push(`mode ${expectedMode}`);
          notes.push('1.3 expressive roles rendered');
          if (errors.length) settle(fail, [...notes, ...errors]); else settle(pass, notes);
        }));
      }, { once: true });
      frame.src = './index.html';
    })();
  </script>
</body>
</html>
