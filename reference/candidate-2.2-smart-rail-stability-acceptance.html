<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glaze UI 2.2 Smart Rail Stability Acceptance</title>
<link rel="stylesheet" href="../css/glaze-2.2.advanced.candidate.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--glz22-canvas);color:var(--glz22-text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;padding:24px}.wrap{display:flex;gap:20px;align-items:flex-start;max-width:720px;margin:auto}.workspace{flex:1;min-width:0;min-height:420px;padding:20px;border:1px solid var(--glz22-line);border-radius:24px;background:var(--glz22-base)}.toggle{min-height:48px;border:1px solid var(--glz22-line);border-radius:14px;background:var(--glz22-raised);color:inherit;font:inherit;padding:8px 14px}#result{position:fixed;z-index:99;inset:4px 4px auto;margin:0;padding:8px;background:#111;color:#fff;font:11px/1.35 monospace;opacity:.02;pointer-events:none}#result[data-status="fail"]{opacity:.98;background:#7b1717}@media(max-width:520px){.page{padding:10px}.wrap{gap:10px}.workspace{padding:12px}}
</style>
</head>
<body>
<main class="page">
<div class="wrap">
<nav class="glz22-smart-rail" id="rail" data-context="normal" aria-label="Primary">
  <div class="glz22-rail-zone">
    <button class="glz22-rail-item" id="home" aria-current="page"><span aria-hidden="true">⌂</span><span class="glz22-rail-label">Home</span></button>
    <button class="glz22-rail-item" id="search"><span aria-hidden="true">⌕</span><span class="glz22-rail-label">Search</span></button>
    <button class="glz22-rail-item" id="files"><span aria-hidden="true">□</span><span class="glz22-rail-label">Files</span></button>
  </div>
  <div class="glz22-rail-zone glz22-rail-context" aria-label="Selection actions">
    <button class="glz22-rail-item"><span aria-hidden="true">↗</span><span class="glz22-rail-label">Share</span></button>
    <button class="glz22-rail-item"><span aria-hidden="true">×</span><span class="glz22-rail-label">Delete</span></button>
  </div>
</nav>
<section class="workspace"><h1>Smart Rail stability</h1><p>Core destination geometry is measured relative to the rail, not to page scroll or unrelated grid reflow.</p><button class="toggle" id="toggle">Toggle selection tools</button></section>
</div>
</main>
<pre id="result" data-status="pending">PENDING</pre>
<script>
(()=>{const p=new URLSearchParams(location.search),root=document.documentElement,appearance=p.get('appearance')||'light',mode=p.get('mode')||'normal',dir=p.get('direction')||'ltr';root.dataset.appearance=appearance;root.dataset.mode=mode;root.dir=dir;if(appearance==='deep-dark')root.dataset.glzAppearance='deep-dark';if(mode==='reduced-transparency')root.dataset.glzTransparency='reduced';if(mode==='touch-assistance')root.dataset.glzTouchAssistance='true';const rail=document.getElementById('rail'),toggle=document.getElementById('toggle'),ids=['home','search','files'],rect=e=>e.getBoundingClientRect(),local=()=>{const top=rect(rail).top;return ids.map(id=>rect(document.getElementById(id)).top-top)},fail=[];toggle.addEventListener('click',()=>rail.dataset.context=rail.dataset.context==='selection'?'normal':'selection');addEventListener('load',()=>setTimeout(()=>{try{const before=local();toggle.click();const after=local();before.forEach((v,i)=>{if(Math.abs(v-after[i])>=.5)fail.push(`core destination ${ids[i]} moved ${Math.abs(v-after[i]).toFixed(3)}px inside rail`)});const floor=mode==='touch-assistance'?56:48;[...document.querySelectorAll('.glz22-rail-item')].filter(e=>rect(e).width>0&&rect(e).height>0).forEach(e=>{if(rect(e).height+.5<floor)fail.push(`visible rail target ${e.textContent.trim()} ${rect(e).height}px < ${floor}px`)});if(getComputedStyle(document.querySelector('.glz22-rail-context')).display==='none')fail.push('contextual tools did not appear');}catch(e){fail.push(e.stack||String(e))}const out=document.getElementById('result');out.dataset.status=fail.length?'fail':'pass';out.textContent=fail.length?'FAIL\n- '+fail.join('\n- '):`PASS smart rail local stability ${innerWidth}x${innerHeight} ${appearance} ${mode} ${dir}`;document.title=out.textContent.split('\n')[0]},300)});})();
</script>
</body></html>
