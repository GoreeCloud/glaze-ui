<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glaze UI 2.1 Candidate rendered acceptance</title><style>html,body{margin:0;background:#111;color:#fff;font-family:ui-monospace,monospace}iframe{display:block;border:0;background:#fff}#result{white-space:pre-wrap;margin:0;padding:12px}</style></head>
<body><iframe id="target" title="Glaze UI 2.1 Candidate rendered target"></iframe><pre id="result" data-status="pending">PENDING</pre>
<script>(()=>{const p=new URLSearchParams(location.search);const width=Number(p.get('width')||390),height=Number(p.get('height')||844),flow=p.get('flow')||'settings',appearance=p.get('appearance')||'light',clarity=p.get('clarity')||'balanced',expression=p.get('expression')||'balanced',density=p.get('density')||'standard',performance=p.get('performance')||'balanced',formFactor=p.get('formFactor')||'mobile',mode=p.get('mode')||'normal';const frame=document.getElementById('target'),result=document.getElementById('result');frame.style.width=`${width}px`;frame.style.height=`${height}px`;const settle=(status,messages)=>{if(result.dataset.status!=='pending')return;result.dataset.status=status;result.textContent=`${status.toUpperCase()}\n${messages.join('\n')}`;document.title=`${status.toUpperCase()} — Glaze UI 2.1 Candidate rendered acceptance`;};const timer=setTimeout(()=>settle('fail',['2.1 reference flow did not complete runtime acceptance']),14000);
frame.addEventListener('load',()=>{const win=frame.contentWindow,doc=frame.contentDocument;if(!win||!doc){clearTimeout(timer);return settle('fail',['reference frame unavailable']);}let observer;const inspect=()=>{const runtime=doc.body?.dataset.runtimeAccepted;if(!runtime||runtime==='pending')return;observer?.disconnect();clearTimeout(timer);const errors=[],notes=[],style=n=>win.getComputedStyle(n),rect=n=>n.getBoundingClientRect(),root=doc.documentElement,body=doc.body,shell=doc.querySelector('.g21-shell'),content=doc.getElementById('solid-content'),nav=doc.querySelector('.primary-nav'),selected=nav?.querySelector('[aria-current="page"]'),materials=[...doc.querySelectorAll('[data-glaze-material-level]')],high=materials.filter(n=>['glaze','deep-glaze','live-glaze'].includes(n.dataset.glazeMaterialLevel));const expectedClarity=(mode==='reduced-transparency'||mode==='forced-colors')?'solid':clarity;const expectedDensity=(mode==='large-text'&&density==='compact')?'standard':density;const expectedTouch=mode==='touch-assistance'?56:48;
if(body.dataset.glazeCandidate!=='2.1')errors.push('Candidate identity marker missing');if(runtime!=='true')errors.push(`runtime acceptance ${runtime}: ${body.dataset.runtimeError||'unknown error'}`);if(body.dataset.materialBudgetAccepted!=='true')errors.push(`Material Budget failed at ${body.dataset.materialBudgetPercent||'missing'}%`);if(root.dataset.glazeAppearance!==appearance)errors.push(`appearance ${root.dataset.glazeAppearance||'missing'} != ${appearance}`);if(root.dataset.glazeClarity!==expectedClarity)errors.push(`clarity ${root.dataset.glazeClarity||'missing'} != ${expectedClarity}`);if(root.dataset.glazeExpression!==expression)errors.push(`expression ${root.dataset.glazeExpression||'missing'} != ${expression}`);if(root.dataset.glazeDensity!==expectedDensity)errors.push(`density ${root.dataset.glazeDensity||'missing'} != ${expectedDensity}`);if(root.dataset.glazePerformance!==performance)errors.push(`performance ${root.dataset.glazePerformance||'missing'} != ${performance}`);if(shell?.dataset.formFactor!==formFactor)errors.push(`form factor ${shell?.dataset.formFactor||'missing'} != ${formFactor}`);if(win.innerWidth!==width)errors.push(`viewport width ${win.innerWidth} != ${width}`);if(root.scrollWidth>root.clientWidth+1||body.scrollWidth>body.clientWidth+1)errors.push('horizontal overflow detected');for(const[name,node]of Object.entries({shell,content,nav,selected})){if(!node||rect(node).width<=0||rect(node).height<=0)errors.push(`required region did not render: ${name}`);}if(content){const bg=style(content).backgroundColor;if(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)')errors.push(`content surface is not solid: ${bg||'missing'}`);}if(appearance==='deep-dark'){const canvas=style(body).backgroundColor.replace(/\s+/g,'');if(canvas!=='rgb(0,0,0)'&&canvas!=='rgba(0,0,0,1)')errors.push(`Deep Dark canvas is not black: ${style(body).backgroundColor}`);}
for(const node of doc.querySelectorAll('[data-hit-target]')){const r=rect(node);if(r.width>0&&r.height>0&&(r.width<expectedTouch-.5||r.height<expectedTouch-.5))errors.push(`hit target below ${expectedTouch}px: ${node.textContent.trim()} ${r.width}×${r.height}`);}for(const node of high){const backdrop=style(node).backdropFilter||style(node).webkitBackdropFilter||'';const shouldBeSolid=expectedClarity==='solid'||performance==='minimal'||mode==='forced-colors';if(shouldBeSolid){if(backdrop&&backdrop!=='none'&&!/blur\(0px\)/.test(backdrop))errors.push(`solid/fallback material retained blur: ${backdrop}`);}else if(!backdrop||backdrop==='none'||/blur\(0px\)/.test(backdrop)){errors.push(`interactive material lost bounded blur: ${backdrop||'missing'}`);}}
if(mode==='reduced-motion'){const scale=parseFloat(style(root).getPropertyValue('--g21-motion-scale'));if(!(scale<=.2))errors.push(`reduced-motion scale ${scale} > .2`);if(root.dataset.glazeMotionExpression!=='calm')errors.push('reduced motion did not resolve motion expression to calm');}if(mode==='large-text'){if(parseFloat(style(shell).fontSize)<30)errors.push(`large-text rendering below 200% intent: ${style(shell).fontSize}`);if(root.scrollWidth>width+1||body.scrollWidth>width+1)errors.push('large-text layout failed reflow');}if(mode==='touch-assistance'&&parseFloat(style(root).getPropertyValue('--g21-touch-min'))<56)errors.push('touch assistance did not raise target floor to 56px');if(mode==='increased-contrast'&&root.dataset.glazeBoundaryStrength!=='strong')errors.push('increased contrast did not strengthen boundaries');if(mode==='forced-colors'){if(!win.matchMedia('(forced-colors: active)').matches)errors.push('forced-colors environment not active');if(root.dataset.glazeClarity!=='solid')errors.push('forced colors did not force Solid clarity');}
if(formFactor==='mobile'){if(nav&&style(nav).position!=='fixed')errors.push('mobile navigation is not fixed in the Action Zone');if(nav&&style(nav).flexDirection!=='row')errors.push(`mobile navigation is not horizontal: ${style(nav).flexDirection}`);}else if(nav&&style(nav).flexDirection!=='column')errors.push(`${formFactor} navigation is not a vertical rail/sidebar: ${style(nav).flexDirection}`);
if(flow==='settings'){if(body.dataset.referenceFlow!=='settings-preferences')errors.push('settings flow marker missing');for(const text of['Appearance','Material clarity','Accessibility'])if(!doc.body.innerText.includes(text))errors.push(`settings reference missing ${text}`);if(!doc.querySelector('.accessibility-card'))errors.push('settings accessibility card missing');}else if(flow==='files'){if(body.dataset.referenceFlow!=='file-management')errors.push('file-management flow marker missing');if(!doc.querySelector('.file-list'))errors.push('file list missing');for(const text of['Local only','Stored in GoreeCloud','Synced','Sync pending','Conflict','Offline copy available','Backup protected'])if(!doc.body.innerText.includes(text))errors.push(`file-state vocabulary missing ${text}`);}else errors.push(`unknown flow ${flow}`);
notes.push(`flow ${flow}`);notes.push(`viewport ${width}×${height}`);notes.push(`appearance ${appearance}`);notes.push(`clarity ${expectedClarity}`);notes.push(`density ${expectedDensity}`);notes.push(`performance ${performance}`);notes.push(`mode ${mode}`);notes.push(`material budget ${body.dataset.materialBudgetPercent||'?'}% / 22%`);settle(errors.length?'fail':'pass',[...notes,...errors]);};observer=new MutationObserver(inspect);if(doc.body)observer.observe(doc.body,{attributes:true,attributeFilter:['data-runtime-accepted','data-runtime-error']});inspect();},{once:true});const target=new URLSearchParams({appearance,clarity,expression,density,performance,formFactor,mode});frame.src=`./candidate-2.1-${flow==='files'?'files':'settings'}.html?${target.toString()}`;})();</script></body></html>
