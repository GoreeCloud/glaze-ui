<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glaze UI 2.2 Performance Acceptance</title>
<link rel="stylesheet" href="../css/glaze-2.2.candidate.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--glz22-canvas);color:var(--glz22-text-primary);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;padding:16px}.content{max-width:820px;margin:auto;padding:20px;border:1px solid var(--glz22-line);border-radius:20px;background:var(--glz22-base)}.surface-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.surface{min-height:120px;padding:16px;border:1px solid var(--glz22-line);border-radius:20px}.overlay,.panel{background:var(--glz22-overlay-bg);-webkit-backdrop-filter:blur(var(--glz22-effective-blur));backdrop-filter:blur(var(--glz22-effective-blur))}.critical{background:color-mix(in srgb,var(--glz22-base) 98%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}.floating{position:fixed;right:12px;bottom:12px;min-height:48px;padding:10px 14px;border:1px solid var(--glz22-line);border-radius:999px;background:var(--glz22-overlay-bg);-webkit-backdrop-filter:blur(var(--glz22-effective-blur));backdrop-filter:blur(var(--glz22-effective-blur))}#result{position:fixed;z-index:999;inset:4px 4px auto;margin:0;padding:8px;background:#111;color:#fff;font:11px/1.35 monospace;opacity:.02;pointer-events:none}#result[data-status="fail"]{opacity:.98;background:#7b1717}[hidden]{display:none!important}@media(max-width:620px){.surface-grid{grid-template-columns:1fr}}@media(forced-colors:active){.content,.surface,.floating{background:Canvas;color:CanvasText;border-color:CanvasText;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<main id="shell" class="shell">
  <article class="content" data-glz22-surface="application"><h1>Performance & Glaze budget</h1><p>Deterministic complexity acceptance for profile blur caps and effects-free fallbacks.</p>
    <div class="surface-grid">
      <section id="overlay" class="surface overlay" data-glz22-surface="system-overlay" data-glz22-dominant-glaze="true"><strong>System Overlay</strong><p>Search-like transient interaction.</p></section>
      <section id="panel" class="surface panel" data-glz22-surface="system-panel" data-glz22-dominant-glaze="true" hidden><strong>System Panel</strong><p>Dense system controls.</p></section>
      <section id="critical" class="surface critical" data-glz22-surface="critical-system"><strong>Critical System</strong><p>Always explicit and effects-free.</p></section>
    </div>
  </article>
  <div id="floating" class="floating" data-glz22-surface="system-overlay" data-glz22-floating-glaze="true">Background status</div>
</main>
<pre id="result" data-status="pending">PENDING</pre>
<script type="module">
import {applySystemShellRuntime,evaluateSystemGlazeBudget,measureSystemGlazeBudget,resolveSystemMotion,resolveSystemPreferences,resolveSystemSurface} from '../js/glaze-2.2.candidate.mjs';

const params=new URLSearchParams(location.search),profile=params.get('profile')||'balanced',mode=params.get('mode')||'normal',appearance=params.get('appearance')||'light',root=document.documentElement,shell=document.getElementById('shell');
root.style.colorScheme=appearance==='light'?'light':'dark';
const input={appearance,performanceProfile:profile,reducedTransparency:mode==='reduced-transparency',forcedColors:mode==='forced-colors',reducedMotion:mode==='reduced-motion'};
const prefs=resolveSystemPreferences(input);
applySystemShellRuntime({root,shell,input});
if(mode==='reduced-transparency')root.dataset.glzTransparency='reduced';

const expectedCaps={full:32,balanced:28,constrained:14,minimal:0},baseBlur={'system-overlay':22,'system-panel':28,'critical-system':0};
const one=s=>document.querySelector(s),assert=(c,m,f)=>{if(!c)f.push(m)},tick=(ms=20)=>new Promise(r=>setTimeout(r,ms));

async function run(){
  const failures=[];
  try{
    await tick();
    for(const surface of Object.keys(baseBlur)){
      const resolved=resolveSystemSurface(surface,prefs),cap=expectedCaps[profile];
      const expected=(prefs.reducedTransparency||prefs.forcedColors||surface==='critical-system')?0:Math.min(baseBlur[surface],cap);
      assert(resolved.blurPx===expected,`${profile} ${surface} blur ${resolved.blurPx} != ${expected}`,failures);
      assert(resolved.nestedBackdropBlurAllowed===false,`${surface} permits nested blur`,failures);
    }
    assert(one('#critical').dataset.effectiveBlur==='0','critical rendered blur must be zero',failures);
    const overlayBlur=Number(one('#overlay').dataset.effectiveBlur);
    assert(overlayBlur<=expectedCaps[profile],`rendered overlay blur ${overlayBlur} exceeds ${profile} cap`,failures);
    const budget=measureSystemGlazeBudget(document);
    assert(budget.accepted&&budget.dominantPanels===1&&budget.smallFloatingControls===1,'visible runtime Glaze budget must accept one panel + one floating control',failures);
    assert(evaluateSystemGlazeBudget({dominantPanels:2,smallFloatingControls:1}).accepted===false,'two dominant panels must fail budget without explicit exception',failures);

    one('#overlay').hidden=true;
    one('#panel').hidden=false;
    await tick();
    const switched=measureSystemGlazeBudget(document);
    assert(switched.accepted&&switched.dominantPanels===1,'hidden prior panel must not consume visible Glaze budget',failures);
    if(mode==='reduced-transparency'||mode==='forced-colors'){
      assert(Number(one('#panel').dataset.effectiveBlur)===0,'effects-free fallback must render panel blur at zero',failures);
    }

    const motion=resolveSystemMotion('panel',resolveSystemPreferences({...input,reducedMotion:true}));
    assert(motion.keyboardTraversalWaitsForAnimation===false&&motion.directManipulationTracksInput===true,'motion fallback must preserve immediate semantic interaction',failures);
    assert(document.documentElement.scrollWidth<=innerWidth+1,'performance reference exceeds viewport width',failures);
  }catch(err){
    failures.push(err?.stack||String(err));
  }
  const out=one('#result');
  out.dataset.status=failures.length?'fail':'pass';
  out.textContent=failures.length?'FAIL\n- '+failures.join('\n- '):`PASS performance ${profile} ${mode} ${appearance} ${innerWidth}x${innerHeight}`;
  document.title=out.textContent.split('\n')[0];
}

addEventListener('load',()=>setTimeout(run,mode==='reduced-motion'?50:300));
</script>
</body></html>
