<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glaze Motion 0.4 Experimental Acceptance</title><link rel="stylesheet" href="../css/glaze.motion.core.css"><style>body{margin:0;padding:24px;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:0 auto}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.box{width:128px;height:88px;border:1px solid currentColor;border-radius:16px;display:grid;place-items:center}#drag{--glaze-motion-drag-x:18px;--glaze-motion-drag-y:6px}#queue{display:grid;gap:8px;padding:0;list-style:none}#queue li{display:flex;gap:8px;align-items:center}#result{white-space:pre-wrap}</style></head>
<body><main><h1>Glaze Motion 0.4 Experimental Acceptance</h1><div class="row"><button id="button" data-glaze-motion-role="button">Action</button><div id="dialog" class="box" data-glaze-motion-role="dialog">Dialog</div><div id="drag" class="box glaze-motion-core-drag-target" data-glaze-dragging="true">Drag</div></div><ol id="queue" aria-label="Reference queue"><li data-key="a"><button type="button">Alpha</button></li><li data-key="b"><button type="button">Beta</button></li><li data-key="c"><button type="button">Gamma</button></li></ol><pre id="result" data-status="pending">PENDING</pre></main>
<script type="module">import{createAccessibleReorderController,createDragSession,createFrameBudgetProbe,createMotionAdapter,createPanZoomState,createSettlingBudget,createSharedElementName,resolveSnapPoint,resolveSwipeAction,startSharedTransition}from"../js/glaze.motion.core.js";const result=document.querySelector("#result"),failures=[],reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,dialog=document.querySelector("#dialog"),drag=document.querySelector("#drag"),dialogDuration=getComputedStyle(dialog).transitionDuration,dragTransform=getComputedStyle(drag).transform,adapter=createMotionAdapter("dialog",{reducedMotion:reduced});if(reduced&&dialogDuration!=="0s")failures.push(`reduced dialog duration was ${dialogDuration}`);if(!reduced&&dialogDuration==="0s")failures.push("normal dialog duration collapsed unexpectedly");if(reduced&&adapter.durationMs!==0)failures.push("runtime adapter did not collapse under reduced motion");if(!reduced&&adapter.durationMs!==240)failures.push(`normal adapter duration was ${adapter.durationMs}`);if(dragTransform==="none")failures.push("direct drag transform disappeared; direct manipulation must remain trackable");const session=createDragSession({startTime:0,axis:"x"}),snapshot=session.update({x:20,y:50,time:20});if(!snapshot.active||snapshot.deltaX!==20||snapshot.deltaY!==0)failures.push("drag session contract failed");if(resolveSnapPoint(45,[0,50,100],{velocity:.8})!==100)failures.push("velocity projection snap failed");if(resolveSwipeAction(-40,100,{velocity:0})!=="start")failures.push("semantic swipe resolution failed");if(createSharedElementName("acceptance-card")!=="glaze-acceptance-card")failures.push("shared-element naming failed");const reorder=createAccessibleReorderController([{id:"a"},{id:"b"},{id:"c"}]),reorderResult=reorder.moveByCommand("b","Home");if(!reorderResult.moved||reorderResult.position!==1||reorderResult.total!==3||reorderResult.items.map(item=>item.id).join(",")!=="b,a,c")failures.push("accessible reorder metadata failed");if("announcement" in reorderResult)failures.push("reorder controller must not hard-code localized announcement copy");const panZoom=createPanZoomState({minScale:1,maxScale:3});panZoom.panBy(10,5);const zoomed=panZoom.zoomTo(9,{anchorX:10,anchorY:5});if(zoomed.scale!==3)failures.push("pan/zoom clamp failed");const budget=createSettlingBudget({maxConcurrent:1,reducedMotion:reduced}),ticketA=budget.acquire(),ticketB=budget.acquire();if(reduced){if(ticketA.accepted||ticketA.reason!=="reduced-motion")failures.push("reduced motion must refuse settling animation")}else{if(!ticketA.accepted||ticketB.accepted||ticketB.reason!=="budget-exhausted")failures.push("settling budget did not bound concurrent motion");ticketA.release()}const probe=createFrameBudgetProbe({targetFps:60,maxLongTaskMs:50});probe.recordFrame(0);probe.recordFrame(17);probe.recordLongTask(55);const metrics=probe.snapshot();if(metrics.frameCount!==1||metrics.overBudgetFrames!==1||metrics.longTaskCount!==1||"send" in metrics)failures.push("local-only performance evidence failed");let selected=null;const shared=startSharedTransition(()=>{selected="card";return selected},{document:{},reducedMotion:false});if(shared.usedViewTransition||selected!=="card")failures.push("shared-transition fallback failed");if(failures.length){result.dataset.status="fail";result.textContent=`FAIL\n${failures.join("\n")}`}else{result.dataset.status="pass";result.textContent=`PASS Glaze Motion 0.4 rendered acceptance (${reduced?"reduced-motion":"normal"})`}</script></body></html>
