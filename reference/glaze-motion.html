<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glaze Motion Experimental Acceptance</title><link rel="stylesheet" href="../css/glaze.motion.core.css"><style>body{margin:0;padding:24px;font:16px/1.5 system-ui,sans-serif}main{max-width:720px;margin:0 auto}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.box{width:128px;height:88px;border:1px solid currentColor;border-radius:16px;display:grid;place-items:center}#drag{--glaze-motion-drag-x:18px;--glaze-motion-drag-y:6px}#result{white-space:pre-wrap}</style></head>
<body><main><h1>Glaze Motion 0.2 Experimental Acceptance</h1><div class="row"><button id="button" data-glaze-motion-role="button">Action</button><div id="dialog" class="box" data-glaze-motion-role="dialog">Dialog</div><div id="drag" class="box glaze-motion-core-drag-target" data-glaze-dragging="true">Drag</div></div><pre id="result" data-status="pending">PENDING</pre></main>
<script type="module">import{createDragSession,createMotionAdapter,createSharedElementName,resolveSnapPoint}from"../js/glaze.motion.js";const result=document.querySelector("#result"),failures=[],reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,dialog=document.querySelector("#dialog"),drag=document.querySelector("#drag"),dialogDuration=getComputedStyle(dialog).transitionDuration,dragTransform=getComputedStyle(drag).transform,adapter=createMotionAdapter("dialog",{reducedMotion:reduced});if(reduced&&dialogDuration!=="0s")failures.push(`reduced dialog duration was ${dialogDuration}`);if(!reduced&&dialogDuration==="0s")failures.push("normal dialog duration collapsed unexpectedly");if(reduced&&adapter.durationMs!==0)failures.push("runtime adapter did not collapse under reduced motion");if(!reduced&&adapter.durationMs!==240)failures.push(`normal adapter duration was ${adapter.durationMs}`);if(dragTransform==="none")failures.push("direct drag transform disappeared; direct manipulation must remain trackable");const session=createDragSession({startTime:0,axis:"x"}),snapshot=session.update({x:20,y:50,time:20});if(!snapshot.active||snapshot.deltaX!==20||snapshot.deltaY!==0)failures.push("drag session contract failed");if(resolveSnapPoint(45,[0,50,100],{velocity:.8})!==100)failures.push("velocity projection snap failed");if(createSharedElementName("acceptance-card")!=="glaze-acceptance-card")failures.push("shared-element naming failed");if(failures.length){result.dataset.status="fail";result.textContent=`FAIL\n${failures.join("\n")}`}else{result.dataset.status="pass";result.textContent=`PASS Glaze Motion rendered acceptance (${reduced?"reduced-motion":"normal"})`}</script></body></html>
