<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glaze UI 2.1 Candidate resilience acceptance</title><style>html,body{margin:0;background:#111;color:#fff;font-family:ui-monospace,monospace}iframe{display:block;border:0;background:#fff}#result{white-space:pre-wrap;margin:0;padding:12px}</style></head><body><iframe id="target" title="Glaze UI 2.1 resilience acceptance target"></iframe><pre id="result" data-status="pending">PENDING</pre><script>(()=>{const p=new URLSearchParams(location.search),width=Number(p.get('width')||1280),height=Number(p.get('height')||900),appearance=p.get('appearance')||'light',clarity=p.get('clarity')||'solid',density=p.get('density')||'standard',performance=p.get('performance')||'constrained',formFactor=p.get('formFactor')||'desktop',mode=p.get('mode')||'normal',frame=document.getElementById('target'),result=document.getElementById('result'),requiredStates=['default','selected','empty','unavailable','conflict','expired','destructive','degraded','warning','error','offline','protected','restricted'],requiredText=['Service unavailable','Session expired','Sync conflict','Destructive action','No results','Reference only'];frame.style.width=`${width}px`;frame.style.height=`${height}px`;const settle=(s,m)=>{if(result.dataset.status!=='pending')return;result.dataset.status=s;result.textContent=`${s.toUpperCase()}\n${m.join('\n')}`;document.title=`${s.toUpperCase()} — Glaze UI 2.1 resilience acceptance`;};const timer=setTimeout(()=>settle('fail',['resilience reference did not complete runtime acceptance']),16000);frame.addEventListener('load',()=>{const win=frame.contentWindow,doc=frame.contentDocument;if(!win||!doc){clearTimeout(timer);return settle('fail',['reference frame unavailable']);}let observer;const inspect=()=>{const runtime=doc.body?.dataset.runtimeAccepted;if(!runtime||runtime==='pending')return;observer?.disconnect();clearTimeout(timer);const errors=[],n ;if(shell?.dataset.formFactor!==formFactor)errors.push(`form factor ${shell?.dataset.formFactor||'missing'} != ${formFactor}`);if(win.innerWidth!==width)errors.push(`viewport width ${win.innerWidth} != ${width}`);if(root.scrollWidth>root.clientWidth+1||body.scrollWidth>body.clientWidth+1)errors.push('horizontal overflow detected');for(const[name,node]of Object.entries({shell,content,nav,selected}))if(!node||rect(node).width<=0||rect(node).height<=0)errors.push(`required region did not render: ${name}`);if(content){const bg=style(content).backgroundColor;if(!bg||bg==='transparent'||bg==='rgba(0, 0, 0, 0)')errors.push(`content surface is not solid: ${bg||'missing'}`);}const present=new Set([...doc.querySelectorAll('[data-regression-state]')].map(n=>n.dataset.regressionState));for(const state of requiredStates)if(!present.has(state))errors.push(`required exceptional state missing: ${state}`);for(const text of requiredText)if(!body.innerText.includes(text))errors.push(`resilience reference missing required text: ${text}`);for(const node of doc.querySelectorAll('[data-hit-target]')){if(node.disabled)continue;const r=rect(node);if(r.width>0&&r.height>0&&(r.width<expectedTouch-.5||r.height<expectedTouch-.5))errors.push(`hit target below ${expectedTouch}px: ${node.textContent.trim()} ${r.width}×${r.height}`);}if(mode==='large-text'){if(parseFloat(style(shell).fontSize)<30)errors.push(`large-text rendering below 200% intent: ${style(shell).fontSize}`);if(root.scrollWidth>width+1||body.scrollWidth>width+1)errors.push('large-text layout failed reflow');}if(mode==='reduced-transparency'&&root.dataset.glazeClarity!=='solid')errors.push('Reduced Transparency did not force Solid clarity');if(mode==='forced-colors'){if(!win.matchMedia('(forced-colors: active)').matches)errors.push('forced-colors environment not active');if(root.dataset.glazeClarity!=='solid')errors.push('Forced Colors did not force Solid clarity');}if(formFactor==='mobile'){if(nav&&style(nav).position!=='fixed')err
