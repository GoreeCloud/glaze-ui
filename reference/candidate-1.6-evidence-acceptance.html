<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glaze UI 1.6 Candidate evidence acceptance</title>
  <style>
    html,body{margin:0;background:#111;color:#fff;font-family:ui-monospace,monospace}
    iframe{display:block;border:0;background:#fff}
    #result{white-space:pre-wrap;margin:0;padding:12px}
  </style>
</head>
<body>
  <iframe id="target" title="Glaze UI 1.6 Candidate evidence target"></iframe>
  <pre id="result" data-status="pending">PENDING</pre>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const width = Number(params.get('width') || 390);
      const height = Number(params.get('height') || 844);
      const theme = params.get('theme') || 'light';
      const mode = params.get('mode') || 'normal';
      const formFactor = params.get('formFactor') || 'mobile';
      const textScale = Number(params.get('textScale') || 1);
      const frame = document.getElementById('target');
      const result = document.getElementById('result');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;

      const settle = (status, messages) => {
        if (result.dataset.status !== 'pending') return;
        result.dataset.status = status;
        result.textContent = `${status.toUpperCase()}\n${messages.join('\n')}`;
        document.title = `${status.toUpperCase()} — Glaze UI 1.6 Candidate evidence acceptance`;
      };
      const timer = setTimeout(() => settle('fail', ['evidence frame did not finish loading']), 10000);

      frame.addEventListener('load', () => {
        clearTimeout(timer);
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!win || !doc) return settle('fail', ['evidence frame unavailable']);
        doc.body.dataset.glazeFormFactor = formFactor;
        win.requestAnimationFrame(() => win.requestAnimationFrame(() => {
          const errors = [];
          const notes = [];
          const style = node => win.getComputedStyle(node);
          const rect = node => node.getBoundingClientRect();
          const root = doc.documentElement;
          const body = doc.body;
          const shell = doc.querySelector('.shell');
          const cards = [...doc.querySelectorAll('.glaze-evidence-card')];
          const authorityCards = [...doc.querySelectorAll('[data-authority-domain]')];
          const currentChips = [...doc.querySelectorAll('.glaze-evidence-chip[data-freshness="current"]')];
          const availableChips = [...doc.querySelectorAll('.glaze-evidence-chip[data-transport="available"]')];
          const expired = doc.querySelector('.glaze-evidence-chip[data-freshness="expired"]');
          const unknown = doc.querySelector('.glaze-evidence-chip[data-freshness="unknown"]');
          const unavailable = doc.querySelector('.glaze-evidence-chip[data-transport="unavailable"]');
          const details = [...doc.querySelectorAll('.glaze-evidence-details summary')];
          const privacyCard = doc.querySelector('[data-authority-domain="privacy"]');
          const continuityCard = doc.querySelector('[data-authority-domain="continuity"]');
          const conflict = doc.querySelector('.glaze-evidence-conflict');
          const header = doc.querySelector('.glaze-glass-functional');
          const themeButton = doc.querySelector('.theme-group button');

          if (body.dataset.glazeCandidate !== '1.6-evidence') errors.push('Candidate evidence identity marker missing');
          if (root.dataset.theme !== theme) errors.push(`theme marker ${root.dataset.theme || 'missing'} != ${theme}`);
          if (body.dataset.glazeFormFactor !== formFactor) errors.push(`form-factor marker ${body.dataset.glazeFormFactor || 'missing'} != ${formFactor}`);
          if (win.innerWidth !== width) errors.push(`viewport width ${win.innerWidth} != ${width}`);
          if (root.scrollWidth > root.clientWidth + 1 || body.scrollWidth > body.clientWidth + 1) errors.push('root horizontal overflow detected');
          if (!shell || rect(shell).width <= 0) errors.push('evidence shell did not render');
          if (cards.length < 7) errors.push(`expected at least 7 evidence surfaces, got ${cards.length}`);

          const domains = new Set(authorityCards.map(card => card.dataset.authorityDomain));
          for (const domain of ['security','privacy','continuity','coordination']) {
            if (!domains.has(domain)) errors.push(`missing authority domain ${domain}`);
          }
          if (authorityCards.length !== 4) errors.push(`expected four primary authority cards, got ${authorityCards.length}`);

          if (!privacyCard || !privacyCard.textContent.includes('Data use denied') || !privacyCard.textContent.includes('Freshness is not success')) {
            errors.push('current Privacy Shield denial example missing');
          }
          if (!continuityCard || !continuityCard.textContent.includes('Restore verification failed')) {
            errors.push('current Everkeep negative recovery example missing');
          }
          if (!conflict || conflict.children.length !== 2 || !conflict.textContent.includes('Wardveil Security') || !conflict.textContent.includes('Privacy Shield')) {
            errors.push('conflicting authority example does not preserve separate domains');
          }
          if (body.textContent.includes('All safe') || body.textContent.includes('Everything is protected')) {
            errors.push('generic aggregate safety verdict present');
          }

          for (const chip of [...currentChips, ...availableChips]) {
            if (style(chip).borderStyle !== 'solid') errors.push(`current/available transport chip is not presentation-neutral: ${chip.textContent.trim()}`);
            if (style(chip).color !== style(body).color) errors.push(`current/available chip overrides inherited truth-neutral color: ${chip.textContent.trim()}`);
          }
          for (const [name,chip] of Object.entries({expired,unknown,unavailable})) {
            if (!chip || style(chip).borderStyle !== 'dashed') errors.push(`${name} non-current/unavailable state lacks dashed distinction`);
          }

          const targetFloor = formFactor === 'tv' ? 56 : 44;
          for (const item of [...details, themeButton].filter(Boolean)) {
            if (rect(item).height < targetFloor - .5) errors.push(`interactive evidence target below ${targetFloor}px: ${rect(item).height}px`);
          }

          if (width <= 760 && cards.length >= 2) {
            const a = rect(cards[0]);
            const b = rect(cards[1]);
            if (Math.abs(a.left - b.left) > 2 || b.top <= a.top) errors.push('compact evidence cards did not collapse to one column');
          }
          if (width >= 1024 && cards.length >= 2) {
            const a = rect(cards[0]);
            const b = rect(cards[1]);
            if (Math.abs(a.top - b.top) > 2 || b.left <= a.left) errors.push('wide evidence cards did not retain multi-column presentation');
          }

          if (mode === 'reduced-transparency') {
            if (body.dataset.glazeReducedTransparency !== 'true') errors.push('portable reduced-transparency adapter not activated');
            const backdrop = header ? (style(header).backdropFilter || style(header).webkitBackdropFilter) : '';
            if (backdrop && backdrop !== 'none') errors.push(`header backdrop remains active under reduced transparency: ${backdrop}`);
            notes.push('reduced-transparency evidence fallback rendered');
          }
          if (mode === 'reduced-motion') {
            if (!win.matchMedia('(prefers-reduced-motion: reduce)').matches) errors.push('reduced-motion media mode not activated');
            if (cards[0] && style(cards[0]).animationName !== 'none') errors.push(`evidence animation remains under reduced motion: ${style(cards[0]).animationName}`);
            notes.push('reduced-motion evidence behavior rendered');
          }
          if (mode === 'forced-colors') {
            if (!win.matchMedia('(forced-colors: active)').matches) errors.push('forced-colors media mode not activated');
            if (cards[0] && parseFloat(style(cards[0]).borderWidth) < 1) errors.push('forced-colors evidence card border missing');
            notes.push('forced-colors evidence distinction rendered');
          }

          if (textScale >= 2) {
            const rootSize = parseFloat(style(root).fontSize);
            if (rootSize < 30) errors.push(`200% text scale did not apply: ${rootSize}px`);
            if (root.scrollWidth > root.clientWidth + 1) errors.push('200% text scale caused horizontal root overflow');
            notes.push(`text scale ${textScale} reflow rendered`);
          }

          if (formFactor === 'tv' && details[0] && rect(details[0]).height < 56) errors.push('TV disclosure target did not retain 56px far-view floor');

          notes.push(`authority domains ${[...domains].join(',')}`);
          notes.push(`viewport ${width}×${height}`);
          notes.push(`theme ${theme}`);
          notes.push(`mode ${mode}`);
          notes.push(`form factor ${formFactor}`);
          settle(errors.length ? 'fail' : 'pass', [...notes, ...errors]);
        }));
      }, {once:true});

      frame.src = `./candidate-1.6-evidence.html?${new URLSearchParams({theme,mode,textScale}).toString()}`;
    })();
  </script>
</body>
</html>
