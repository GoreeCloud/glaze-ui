<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glaze UI 2.2 Foundation Acceptance</title>
  <link rel="stylesheet" href="../css/glaze-2.2.components.runtime.candidate.css">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;background:var(--glz22-canvas);color:var(--glz22-text-primary);font-family:system-ui,sans-serif}.page{width:min(1040px,100%);margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:16px;min-width:0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0}.stack{display:grid;gap:10px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}h1{font-size:28px;margin:0 0 16px}h2{font-size:17px;margin:0 0 10px}.support{color:var(--glz22-text-secondary)}#result{position:fixed;inset:6px 6px auto;z-index:99;max-height:45vh;overflow:auto;margin:0;padding:8px;background:#111;color:#fff;font:11px/1.35 monospace;opacity:.02;pointer-events:none}#result[data-status="fail"]{opacity:.98;background:#7b1717}@media(max-width:700px){.grid,.field-grid{grid-template-columns:1fr}.page{padding:10px}.card{padding:12px}}html[data-mode="large-text"]{font-size:32px}html[data-mode="large-text"] .grid,html[data-mode="large-text"] .field-grid{grid-template-columns:1fr}html[data-mode="large-text"] h1{font-size:1.3rem}html[data-mode="large-text"] h2{font-size:1.05rem}
  </style>
</head>
<body>
<main class="page" id="page">
  <h1>Glaze UI 2.2 Foundation acceptance</h1>
  <div class="grid">
    <section class="card glz22-application" id="buttons-card">
      <h2>Button + IconButton</h2>
      <div class="row">
        <button class="glz22-button" data-variant="primary" data-size="md" id="btn-primary">Save</button>
        <button class="glz22-button" data-variant="secondary" data-size="sm" id="btn-secondary">Duplicate</button>
        <button class="glz22-button" data-variant="quiet" data-size="xs" id="btn-quiet">Cancel</button>
        <button class="glz22-button" data-variant="glaze" data-size="md" id="btn-glaze">Share</button>
        <button class="glz22-button" data-variant="danger" data-size="md" id="btn-danger">Delete</button>
      </div>
      <div class="row">
        <button class="glz22-icon-button" data-variant="quiet" data-size="xs" id="icon-share" aria-label="Share project" title="Share project">↗</button>
        <button class="glz22-icon-button" data-variant="glaze" data-size="md" id="icon-more" aria-label="More actions" title="More actions">•••</button>
        <button class="glz22-icon-button" data-variant="surface" data-size="md" data-state="selected" aria-pressed="true" id="icon-selected" aria-label="Pinned" title="Pinned">◆</button>
      </div>
      <div role="status" id="button-status" class="support">Ready</div>
    </section>

    <section class="card glz22-application">
      <h2>TextField + Select</h2>
      <div class="field-grid">
        <label class="glz22-field" for="name-input">
          <span class="glz22-field-label">Project name</span>
          <span class="glz22-field-control" data-size="sm" data-variant="standard" id="field-standard"><input id="name-input" value="Aurora Workspace" aria-describedby="name-help"></span>
          <span class="glz22-field-message" id="name-help">Visible to workspace members.</span>
        </label>
        <label class="glz22-field" for="endpoint-input">
          <span class="glz22-field-label">Endpoint</span>
          <span class="glz22-field-control" data-size="md" data-variant="glaze" data-error="true" id="field-glaze"><input id="endpoint-input" value="gateway.local" aria-invalid="true" aria-describedby="endpoint-error"></span>
          <span class="glz22-field-message" data-kind="error" id="endpoint-error">Use a fully qualified HTTPS endpoint with a valid domain.</span>
        </label>
        <label class="glz22-field" for="region-select">
          <span class="glz22-field-label">Region</span>
          <select class="glz22-select" data-size="sm" data-variant="filled" id="region-select"><option value="east">US East</option><option value="west">US West</option></select>
          <span class="glz22-field-message">Stored with this workspace.</span>
        </label>
        <label class="glz22-field" for="scope-select">
          <span class="glz22-field-label">Floating scope</span>
          <select class="glz22-select" data-size="md" data-variant="glaze" id="scope-select"><option value="workspace">Workspace</option><option value="project">Project</option></select>
          <span class="glz22-field-message">Floating context uses bounded Glaze.</span>
        </label>
      </div>
    </section>

    <section class="card glz22-application">
      <h2>Checkbox + Radio</h2>
      <div class="stack">
        <label class="glz22-choice" data-kind="checkbox" id="checkbox-row"><input type="checkbox" id="checkbox" checked><span class="glz22-choice-control" aria-hidden="true"></span><span>Back up local project settings and preferences</span></label>
        <label class="glz22-choice" data-kind="checkbox" id="mixed-row"><input type="checkbox" id="mixed" data-indeterminate="true" aria-checked="mixed"><span class="glz22-choice-control" aria-hidden="true"></span><span>Include inherited workspace permissions</span></label>
        <fieldset style="border:0;padding:0;margin:4px 0 0" class="stack"><legend style="font-weight:650">Sync policy</legend>
          <label class="glz22-choice" data-kind="radio"><input type="radio" name="policy" id="radio-auto" value="auto" checked><span class="glz22-choice-control" aria-hidden="true"></span><span>Automatic</span></label>
          <label class="glz22-choice" data-kind="radio"><input type="radio" name="policy" id="radio-manual" value="manual"><span class="glz22-choice-control" aria-hidden="true"></span><span>Manual</span></label>
        </fieldset>
      </div>
    </section>

    <section class="card glz22-application">
      <h2>Switch + Slider</h2>
      <div class="stack">
        <label class="glz22-switch" id="switch-row"><span style="flex:1;min-width:0"><strong>Reduce background activity</strong><br><span class="support">Applies immediately.</span></span><input type="checkbox" role="switch" id="switch" checked><span class="glz22-switch-track" aria-hidden="true"><span class="glz22-switch-thumb"></span></span></label>
        <label class="glz22-slider" for="slider"><span><strong>Panel density</strong></span><span class="glz22-slider-row" id="slider-row"><input type="range" id="slider" min="0" max="100" step="10" value="60" aria-valuetext="60 percent"><output class="glz22-slider-value" id="slider-output" for="slider">60%</output></span></label>
      </div>
    </section>
  </div>
</main>
<pre id="result" data-status="pending">PENDING</pre>
<script>
(()=>{
 const p=new URLSearchParams(location.search),root=document.documentElement;
 const mode=p.get('mode')||'normal',appearance=p.get('appearance')||'light',dir=p.get('direction')||'ltr',input=p.get('input')||'pointer';
 root.dataset.mode=mode;root.dataset.glzInput=input;root.dir=dir;
 if(appearance==='deep-dark')root.setAttribute('data-glz-appearance','deep-dark');
 if(mode==='reduced-transparency')root.dataset.glzTransparency='reduced';
 if(mode==='touch-assistance')root.dataset.glzTouchAssistance='true';
 if(mode==='large-text')root.dataset.glzTextScale='200';
 const slider=document.getElementById('slider'),out=document.getElementById('slider-output');slider.addEventListener('input',()=>{out.textContent=`${slider.value}%`;out.value=`${slider.value}%`;slider.setAttribute('aria-valuetext',`${slider.value} percent`)});
 const primary=document.getElementById('btn-primary');primary.addEventListener('click',()=>{primary.dataset.state='success';primary.textContent='✓ Saved';document.getElementById('button-status').textContent='Saved'});
 const px=v=>Number.parseFloat(v)||0,style=e=>getComputedStyle(e),backdrop=e=>{const s=style(e);return s.backdropFilter||s.webkitBackdropFilter||''},rect=e=>e.getBoundingClientRect();
 const assert=(c,m,f)=>{if(!c)f.push(m)};
 addEventListener('load',()=>setTimeout(()=>{
  const f=[],vw=innerWidth;
  assert(document.documentElement.scrollWidth<=vw+1,`horizontal overflow ${document.documentElement.scrollWidth}>${vw}`,f);
  for(const id of ['btn-primary','btn-secondary','btn-quiet','btn-glaze','btn-danger','icon-share','icon-more','icon-selected','field-standard','field-glaze','region-select','scope-select','checkbox-row','mixed-row','switch-row','slider-row']) assert(rect(document.getElementById(id)).width>0&&rect(document.getElementById(id)).height>0,`${id} not rendered`,f);
  assert(document.getElementById('name-input').closest('label')?.getAttribute('for')==='name-input','TextField label association missing',f);
  assert(document.getElementById('endpoint-input').getAttribute('aria-invalid')==='true'&&document.getElementById('endpoint-input').getAttribute('aria-describedby')==='endpoint-error','TextField error association missing',f);
  assert(document.getElementById('region-select').closest('label')?.getAttribute('for')==='region-select','Select label association missing',f);
  assert(document.getElementById('icon-share').getAttribute('aria-label')&&document.getElementById('icon-share').title,'IconButton label/tooltip missing',f);

  const checkbox=document.getElementById('checkbox');assert(checkbox.checked,'Checkbox initial checked state missing',f);document.getElementById('checkbox-row').click();assert(!checkbox.checked,'Checkbox row did not toggle native state',f);
  const manual=document.getElementById('radio-manual');manual.click();assert(manual.checked&&!document.getElementById('radio-auto').checked,'Radio mutual exclusion failed',f);
  const sw=document.getElementById('switch');sw.click();assert(!sw.checked,'Switch native state did not toggle',f);
  slider.value='80';slider.dispatchEvent(new Event('input',{bubbles:true}));assert(slider.value==='80'&&out.textContent==='80%','Slider value semantics failed',f);
  assert(document.getElementById('region-select').value==='east','Select value semantics failed',f);

  primary.focus();assert(document.activeElement===primary,'Button focus failed',f);const fs=style(primary);assert(fs.outlineStyle!=='none'&&px(fs.outlineWidth)>=2,`focus ring missing ${fs.outlineStyle} ${fs.outlineWidth}`,f);primary.click();assert(primary.textContent.includes('Saved')&&primary.dataset.state==='success','Button success state failed',f);

  if(input==='touch'||mode==='touch-assistance'){
    const expected=mode==='touch-assistance'?56:48;
    for(const id of ['btn-primary','btn-secondary','btn-quiet','btn-glaze','btn-danger','icon-share','icon-more','icon-selected','field-standard','field-glaze','region-select','scope-select','checkbox-row','mixed-row','switch-row','slider-row']){
      const r=rect(document.getElementById(id));assert(r.height+0.1>=expected,`${id} touch height ${r.height.toFixed(1)}<${expected}`,f);if(id.startsWith('icon-'))assert(r.width+0.1>=expected,`${id} touch width ${r.width.toFixed(1)}<${expected}`,f);
    }
  }
  if(mode==='reduced-transparency'||mode==='forced-colors')for(const id of ['btn-glaze','icon-more','field-glaze','scope-select']){const b=backdrop(document.getElementById(id));assert(!b||b==='none',`${id} retained backdrop ${b}`,f)}
  if(mode==='increased-contrast'){assert(px(style(primary).borderTopWidth)>=2,'increased contrast boundary <2px',f);assert(px(style(primary).outlineWidth)>=4,'increased contrast focus <4px',f)}
  if(mode==='large-text'){
    assert(px(style(root).fontSize)>=30,`root large text ${style(root).fontSize}<30px`,f);
    for(const id of ['endpoint-error','name-help']){const r=rect(document.getElementById(id));assert(r.height>0&&r.right<=vw+1,`${id} clipped at 200% text`,f)}
    assert(px(style(document.querySelector('.glz22-field-label')).fontSize)>=24,'field label did not scale for 200% text',f);
  }
  if(dir==='rtl')assert(style(root).direction==='rtl','RTL not applied',f);
  if(mode==='forced-colors')assert(matchMedia('(forced-colors: active)').matches,'forced-colors browser mode not active',f);
  if(mode==='reduced-motion')assert(matchMedia('(prefers-reduced-motion: reduce)').matches,'reduced-motion browser mode not active',f);
  const result=document.getElementById('result');result.dataset.status=f.length?'fail':'pass';result.textContent=f.length?`FAIL\n${f.join('\n')}`:`PASS 2.2 Foundation ${appearance} ${mode} ${dir} ${input}`;
 },60),{once:true});
})();
</script>
</body>
</html>
