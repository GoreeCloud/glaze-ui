<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glaze UI 2.1 Candidate visual snapshot harness</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;border:0;width:100vw;height:100vh;background:#fff}</style></head>
<body data-snapshot-ready="pending"><iframe id="target" title="Glaze UI 2.1 visual baseline target"></iframe><script>(()=>{const p=new URLSearchParams(location.search),flow=p.get('flow')||'settings',state=p.get('snapshotState')||'idle',paths={settings:'candidate-2.1-settings.html',files:'candidate-2.1-files.html',search:'candidate-2.1-search.html',communication:'candidate-2.1-communication.html',media:'candidate-2.1-media.html',resilience:'candidate-2.1-resilience.html'},path=paths[flow],frame=document.getElementById('target'),body=document.body;if(!path){body.dataset.snapshotReady='false';document.title=`FAIL unknown visual flow ${flow}`;return;}const target=new URLSearchParams({appearance:p.get('appearance')||'light',clarity:p.get('clarity')||'balanced',density:p.get('density')||'standard',performance:p.get('performance')||'balanced',formFactor:p.get('formFactor')||'desktop',mode:p.get('mode')||'normal'});const settle=()=>{const doc=frame.contentDocument;if(!doc?.body||doc.body.dataset.runtimeAccepted==='pending'||!doc.body.dataset.runtimeAccepted)return;if(doc.body.dataset.runtimeAccepted!=='true'){body.dataset.snapshotReady='false';document.title='FAIL target runtime';return;}if(state==='command-open'){const trigger=doc.querySelector('[data-command-trigger]'),palette=doc.getElementById('command-palette');if(!trigger||!palette){body.dataset.snapshotReady='false';return;}if(palette.hidden)trigger.click();if(palette.hidden||doc.body.dataset.interactionState!=='command-open'){body.dataset.snapshotReady='false';return;}}else if(state==='message-sent'){const send=doc.querySelector('[data-send-button]'),status=doc.getElementById('outgoing-status');if(!send||!status){body.dataset.snapshotReady='false';return;}if(doc.body.dataset.interactionState!=='message-sent')send.click();if(doc.body.dataset.interactionState!=='message-sent'||status.textContent.trim()!=='Sent'){body.dataset.snapshotReady='false';return;}}else if(state==='playing'){const play=doc.querySelector('[data-play-toggle]'),shell=doc.querySelector('.g21-shell');if(!play||!shell){body.dataset.snapshotReady='false';return;}if(shell.dataset.playbackState!=='playing')play.click();if(shell.dataset.playbackState!=='playing'){body.dataset.snapshotReady='false';return;}}else if(state!=='idle'){body.dataset.snapshotReady='false';document.title=`FAIL unknown snapshot state ${state}`;return;}requestAnimationFrame(()=>requestAnimationFrame(()=>{body.dataset.snapshotReady='true';body.dataset.snapshotFlow=flow;body.dataset.snapshotState=state;document.title=`READY ${flow} ${state}`;}));};frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc?.body){body.dataset.snapshotReady='false';return;}const observer=new MutationObserver(()=>{settle();if(body.dataset.snapshotReady!=='pending')observer.disconnect();});observer.observe(doc.body,{attributes:true,attributeFilter:['data-runtime-accepted','data-interaction-state']});settle();},{once:true});frame.src=`./${path}?${target}`;})();</script></body></html>
