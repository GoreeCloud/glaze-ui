  product_name: GLAZE UI
  repository: GoreeCloud/glaze-ui

lifecycle: stable
version: 1.6.0

supported_platforms:
  - cross-platform

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
    notes: Glaze UI is a shared presentation library and does not own or execute Manager administration, lifecycle, inventory, approval, or remediation operations. Management integration remains a downstream or publication concern where applicable.
  privacy_shield:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - acceptance/v1.6-human-evidence.json
    notes: The V1.6 Stable release preserves Privacy Shield authority boundaries and privacy-safe local presentation behavior but does not operate a Privacy Shield enforcement runtime or collect privacy state as a platform service.
  wardveil_security:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - SECURITY.md
    notes: The V1.6 Stable release presents supplied security states without authenticating, authorizing, protecting, or manufacturing security truth. Wardveil enforcement is outside this shared presentation runtime; Stable security qualification remains separately mandatory.
  everkeep:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - registry/lifecycle.json
    notes: The V1.6 Stable release is stateless and owns no user data, durable application state, backup jobs, restore workflows, or preservation storage. Release rollback remains bound to known-good Glaze UI 1.5.1.
  glaze_ui:
    result: applicable-conformant
    version: 1.6.0
    evidence:
      - acceptance/v1.6-qualification-review.json
      - acceptance/v1.6-machine-evidence.json
      - acceptance/v1.6-rendered-evidence.json
      - acceptance/v1.6-regression-evidence.json
      - acceptance/v1.6-human-evidence.json
      - acceptance/v1.6-assistive-technology-evidence.json
      - acceptance/v1.6-performance-evidence.json
    notes: Glaze UI is the self-authority for this shared design-system release. The frozen V1.6 qualification matrix is 24 verified / 0 unverified / 0 not applicable. The central Platform Contract 0.4 current Stable Glaze UI consumer target is 1.6.0; this repository provides 1.6.0 and validates against the exact central evaluator revision in CI.
  mesh:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
    notes: The shared runtime performs no service discovery, event transport, network coordination, capability authorization, or Mesh registration. Those responsibilities remain with downstream components where applicable.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - acceptance/v1.6-human-evidence.json
    notes: Glaze UI may present identity, permission, restricted, denied, or unavailable states but does not authenticate users, create sessions, resolve identities, or grant authorization.
  policy:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - acceptance/v1.6-human-evidence.json
    notes: Glaze UI may present caller-supplied policy state but cannot define, evaluate, enforce, or manufacture GoreeCloud Policy decisions.
  observability:
    result: not-applicable-justified
    version: null
    evidence:
      - acceptance/v1.6-production-readiness-review.json
      - acceptance/v1.6-performance-evidence.json
    notes: V1.6 diagnostics are local-first and privacy-minimized and evaluate caller-supplied evidence. The shared runtime does not operate an Observability backend or claim production health.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: false
    requirements:
      - The shared runtime is stateless; no application or user data is stored by Glaze UI itself.
  restore:
    required: false
    requirements:
      - Release rollback uses the known-good Glaze UI 1.5.1 source/runtime baseline recorded in registry/lifecycle.json.
  export:
    required: false
    requirements:
      - Glaze UI owns no user dataset requiring export.
  portability:
    required: false
    requirements:
      - The supported Stable runtime is source-distributed ES modules with repository-preserved contracts and evidence.

external_dependencies: []

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: 1.6.0
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui-stable-baseline==1.6.0
  provides:
