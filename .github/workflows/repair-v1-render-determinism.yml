name: Repair GLAZE UI V1 render determinism

on:
  push:
    branches:
      - 'fix/v1.1-import-closure-20260904'
    paths:
      - '.github/workflows/repair-v1-render-determinism.yml'

permissions:
  contents: write

jobs:
  repair-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact maintenance revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Add deterministic paint settling and repeatability check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_glaze_v1_1_rendered.py')
          text = path.read_text(encoding='utf-8')

          old_imports = 'import base64\nimport json\n'
          new_imports = 'import base64\nimport hashlib\nimport json\n'
          if old_imports not in text:
              raise SystemExit('expected renderer import block not found')
          text = text.replace(old_imports, new_imports, 1)

          old_execute = '''def execute(session_id: str, script: str) -> Any:\n    return request("POST", f"/session/{session_id}/execute/sync", {"script": script, "args": []})\n\n\n'''
          new_execute = '''def execute(session_id: str, script: str) -> Any:\n    return request("POST", f"/session/{session_id}/execute/sync", {"script": script, "args": []})\n\n\ndef execute_async(session_id: str, script: str) -> Any:\n    return request("POST", f"/session/{session_id}/execute/async", {"script": script, "args": []})\n\n\n'''
          if old_execute not in text:
              raise SystemExit('expected renderer execute block not found')
          text = text.replace(old_execute, new_execute, 1)

          old_screenshot = '''def screenshot(session_id: str, name: str) -> Path:\n    encoded = request("GET", f"/session/{session_id}/screenshot")\n    require(isinstance(encoded, str) and bool(encoded), f"Chrome did not return screenshot bytes for {name}")\n    ARTIFACTS.mkdir(exist_ok=True)\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(base64.b64decode(encoded))\n    require(path.stat().st_size > 10_000, f"Screenshot appears empty or invalid: {path}")\n    return path\n\n\n'''
          new_screenshot = '''def settle_render(session_id: str) -> None:\n    state = execute_async(session_id, r"""\n        const done = arguments[arguments.length - 1];\n        const complete = () => {\n          window.scrollTo(0, 0);\n          void document.documentElement.getBoundingClientRect();\n          requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(() => {\n            done({\n              ready: document.readyState,\n              fonts: document.fonts ? document.fonts.status : 'unsupported'\n            });\n          })));\n        };\n        if (document.fonts && document.fonts.ready) {\n          document.fonts.ready.then(complete, complete);\n        } else {\n          complete();\n        }\n    """)\n    require(isinstance(state, dict) and state.get("ready") == "complete", f"render did not settle on a complete document: {state}")\n    require(state.get("fonts") in {"loaded", "unsupported"}, f"render fonts did not settle: {state}")\n\n\ndef capture_png(session_id: str, name: str) -> bytes:\n    encoded = request("GET", f"/session/{session_id}/screenshot")\n    require(isinstance(encoded, str) and bool(encoded), f"Chrome did not return screenshot bytes for {name}")\n    image = base64.b64decode(encoded)\n    require(len(image) > 10_000, f"Screenshot appears empty or invalid for {name}")\n    return image\n\n\ndef screenshot(session_id: str, name: str) -> Path:\n    settle_render(session_id)\n    first = capture_png(session_id, name)\n    settle_render(session_id)\n    second = capture_png(session_id, name)\n    first_hash = hashlib.sha256(first).hexdigest()\n    second_hash = hashlib.sha256(second).hexdigest()\n    require(\n        first == second,\n        f"Screenshot capture is nondeterministic for {name}: first={first_hash}, second={second_hash}",\n    )\n    ARTIFACTS.mkdir(exist_ok=True)\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(second)\n    return path\n\n\n'''
          if old_screenshot not in text:
              raise SystemExit('expected renderer screenshot block not found')
          text = text.replace(old_screenshot, new_screenshot, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired renderer source
        run: |
          python3 -m py_compile scripts/validate_glaze_v1_1_rendered.py
          grep -F 'def settle_render(session_id: str) -> None:' scripts/validate_glaze_v1_1_rendered.py
          grep -F 'Screenshot capture is nondeterministic' scripts/validate_glaze_v1_1_rendered.py

      - name: Commit renderer repair and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-v1-render-determinism.yml
          git diff --check
          git config user.name "GoreeCloud Release Maintenance"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add scripts/validate_glaze_v1_1_rendered.py .github/workflows/repair-v1-render-determinism.yml
          git diff --cached --quiet && { echo 'No renderer repair generated'; exit 1; }
          git commit -m "Stabilize GLAZE UI V1 rendered evidence capture"
          CURRENT_REMOTE="$(git ls-remote origin refs/heads/fix/v1.1-import-closure-20260904 | cut -f1)"
          test "$CURRENT_REMOTE" = "$GITHUB_SHA"
          git push origin HEAD:fix/v1.1-import-closure-20260904
