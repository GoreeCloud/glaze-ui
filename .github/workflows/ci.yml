name: Glaze UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile validators
        run: python3 -m py_compile scripts/validate_glaze_ui.py scripts/validate_glaze_2_candidate.py scripts/validate_candidate_2_rendered.py scripts/validate_candidate_2_resilience.py scripts/validate_release_state.py scripts/validate_enforcement.py scripts/validate_form_factors.py scripts/validate_consumer_registry.py scripts/validate_typography_contract.py scripts/validate_adaptive_colors.py scripts/validate_iconography.py scripts/validate_motion.py scripts/validate_glaze_motion.py scripts/validate_glaze_motion_rendered.py scripts/validate_materials.py scripts/validate_layout.py scripts/validate_states.py scripts/validate_evidence_presentation.py scripts/validate_workspace_navigation.py scripts/validate_rendered_reference.py scripts/validate_candidate_1_5_rendered.py scripts/validate_candidate_1_6_rendered.py scripts/validate_candidate_1_6_evidence_rendered.py website/build.py website/validate.py integrations/firefox/validate.py
      - name: Validate Glaze UI repository
        run: python3 scripts/validate_glaze_ui.py
      - name: Validate canonical release state
        run: python3 scripts/validate_release_state.py
      - name: Validate full-spectrum Glaze UI enforcement
        run: python3 scripts/validate_enforcement.py
      - name: Validate enforced Glaze UI 2.0 Candidate source
        run: python3 scripts/validate_glaze_2_candidate.py
      - name: Validate Glaze UI 2.0 Candidate runtime syntax
        run: node --check js/glaze-2.candidate.js
      - name: Validate Glaze UI 2.0 prefers-contrast harness syntax
        run: node --check scripts/validate_candidate_2_contrast.mjs
      - name: Validate Glaze UI 1.5 form-factor contract
        run: python3 scripts/validate_form_factors.py
      - name: Validate Glaze UI 1.5 adaptive color Stable
        run: python3 scripts/validate_adaptive_colors.py
      - name: Validate Glaze UI 1.5 iconography Stable
        run: python3 scripts/validate_iconography.py
      - name: Validate Glaze UI 1.5 motion and interaction Stable
        run: python3 scripts/validate_motion.py
      - name: Validate Glaze Motion 0.6 Experimental source and two-consumer evidence
        run: python3 scripts/validate_glaze_motion.py
      - name: Test retained Glaze Motion 0.4 runtime interaction accessibility and reference consumer
        run: node --test tests/glaze-motion-runtime.test.mjs tests/glaze-motion-interaction.test.mjs tests/glaze-motion-accessibility.test.mjs tests/glaze-motion-consumer.test.mjs
      - name: Validate retained rendered Glaze Motion 0.4 runtime evidence for 0.6
        run: python3 scripts/validate_glaze_motion_rendered.py
      - name: Validate Glaze UI 1.5 material and depth Stable
        run: python3 scripts/validate_materials.py
      - name: Validate Glaze UI 1.5 layout spacing and density Stable
        run: python3 scripts/validate_layout.py
      - name: Validate Glaze UI 1.5 interaction states and input modality Stable
        run: python3 scripts/validate_states.py
      - name: Validate Glaze UI 1.6 evidence presentation Stable
        run: python3 scripts/validate_evidence_presentation.py
      - name: Validate Glaze UI 1.6 adaptive workspace Stable
        run: python3 scripts/validate_workspace_navigation.py
      - name: Test Glaze UI 1.6 Mesh evidence consumer and refresh response presentation
        run: node --test tests/mesh-evidence-consumer.test.mjs tests/mesh-evidence-refresh-response.test.mjs
      - name: Validate typography source contract
        run: python3 scripts/validate_typography_contract.py
      - name: Validate consumer compatibility registry
        run: python3 scripts/validate_consumer_registry.py
      - name: Validate Firefox integration
        run: python3 integrations/firefox/validate.py
      - name: Build and validate public design site
        run: python3 website/validate.py
      - name: Validate rendered Glaze UI reference
        run: python3 scripts/validate_rendered_reference.py
      - name: Validate rendered Glaze UI 1.5 Stable
        run: python3 scripts/validate_candidate_1_5_rendered.py
      - name: Validate rendered Glaze UI 1.6 Stable adaptive workspace
        run: python3 scripts/validate_candidate_1_6_rendered.py
      - name: Validate rendered Glaze UI 1.6 Stable evidence presentation
        run: python3 scripts/validate_candidate_1_6_evidence_rendered.py
      - name: Validate rendered Glaze UI 2.0 Candidate contract
        run: python3 scripts/validate_candidate_2_rendered.py
      - name: Validate Glaze UI 2.0 Candidate fallback and foldable resilience
        run: python3 scripts/validate_candidate_2_resilience.py
      - name: Validate rendered Glaze UI 2.0 increased contrast
        run: node scripts/validate_candidate_2_contrast.mjs
