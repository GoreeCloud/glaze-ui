name: GLAZE UI V1.1 CI

on:
  push:
  pull_request:

jobs:
  validate-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current GLAZE UI V1.1 Stable contract
        run: python scripts/validate_glaze_v1.py
      - name: Validate V1.2 Frosted Neutral Candidate track
        run: python scripts/validate_glaze_v1_2_candidate.py
      - name: Validate rendered V1.2 Frosted Neutral Candidate
        run: python scripts/validate_glaze_v1_2_rendered.py
      - name: Upload V1.2 Frosted Neutral rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glaze-v1.2-frosted-neutral-rendered
          path: artifacts/glaze-v1.2-*.png
          if-no-files-found: warn
      - name: Validate V1 Design Center publication
        run: python website/validate.py
      - name: Validate Design Center mobile-first source contract
        run: python scripts/validate_design_center_responsive.py
      - name: Validate rendered Design Center Mobile UI
        run: python scripts/validate_design_center_mobile.py
      - name: Upload Design Center Mobile UI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-center-mobile-ui
          path: artifacts/design-center-mobile-*.png
          if-no-files-found: warn
      - name: Check V1 runtime syntax
        run: node --check js/glaze-v1.1.0.mjs
