name: Glaze UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile validators
        run: python3 -m py_compile scripts/validate_glaze_ui.py scripts/validate_release_state.py scripts/validate_form_factors.py scripts/validate_consumer_registry.py scripts/validate_typography_contract.py scripts/validate_wearables.py scripts/validate_rendered_reference.py website/build.py website/validate.py integrations/firefox/validate.py
      - name: Validate Glaze UI repository
        run: python3 scripts/validate_glaze_ui.py
      - name: Validate canonical release state
        run: python3 scripts/validate_release_state.py
      - name: Validate Glaze UI 1.4 form-factor contract
        run: python3 scripts/validate_form_factors.py
      - name: Validate wearable Development Candidate contract
        run: python3 scripts/validate_wearables.py
      - name: Validate typography source contract
        run: python3 scripts/validate_typography_contract.py
      - name: Validate consumer compatibility registry
        run: python3 scripts/validate_consumer_registry.py
      - name: Validate Firefox integration
        run: python3 integrations/firefox/validate.py
      - name: Build and validate public design site
        run: python3 website/validate.py
      - name: Validate rendered Glaze UI reference
        run: python3 scripts/validate_rendered_reference.py

  wear-os-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify stable Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
      - name: Install verified Gradle 9.5.0
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip \
            --output /tmp/gradle-9.5.0-bin.zip
          echo "553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746  /tmp/gradle-9.5.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.5.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.5.0/bin" >> "$GITHUB_PATH"
      - name: Compile Wear OS Development Candidate reference
        working-directory: reference/native/wear-os/buildable
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

  watchos-sdk-typecheck:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Record Xcode and watchOS SDK
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk watchos --show-sdk-version
          xcrun --sdk watchos --show-sdk-path
      - name: Typecheck watchOS Development Candidate reference
        working-directory: reference/native/watchos
        shell: bash
        run: |
          SDK_PATH="$(xcrun --sdk watchos --show-sdk-path)"
          xcrun swiftc \
            -typecheck \
            -parse-as-library \
            -sdk "$SDK_PATH" \
            -target arm64-apple-watchos10.0 \
            GlazeWearableReference.swift \
            GlazeWearableReferenceApp.swift

  watchos-simulator-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Record watchOS Simulator SDK
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk watchsimulator --show-sdk-version
          xcrun --sdk watchsimulator --show-sdk-path
      - name: Build packaged watchOS Simulator Development Candidate reference
        working-directory: reference/native/watchos
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk watchsimulator --show-sdk-path)"
          APP_DIR="$RUNNER_TEMP/GlazeWearableReference.app"
          mkdir -p "$APP_DIR"
          cat > "$APP_DIR/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Glaze Wearable Reference</string>
            <key>CFBundleExecutable</key><string>GlazeWearableReference</string>
            <key>CFBundleIdentifier</key><string>com.goreecloud.glazeui.reference.watchos</string>
            <key>CFBundleName</key><string>GlazeWearableReference</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>10.0</string>
            <key>WKApplication</key><true/>
          </dict>
          </plist>
          PLIST
          xcrun swiftc \
            -parse-as-library \
            -sdk "$SDK_PATH" \
            -target arm64-apple-watchos10.0-simulator \
            GlazeWearableReference.swift \
            GlazeWearableReferenceApp.swift \
            -o "$APP_DIR/GlazeWearableReference"
          plutil -lint "$APP_DIR/Info.plist"
          file "$APP_DIR/GlazeWearableReference"
          codesign --force --sign - "$APP_DIR"
          codesign --verify --strict "$APP_DIR"
