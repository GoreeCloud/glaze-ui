name: Glaze UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile validators
        run: python3 -m py_compile scripts/validate_glaze_ui.py scripts/validate_rendered_reference.py website/build.py website/validate.py
      - name: Validate Glaze UI repository
        run: python3 scripts/validate_glaze_ui.py
      - name: Build and validate public design site
        run: python3 website/validate.py
      - name: Validate rendered Glaze UI reference
        run: python3 scripts/validate_rendered_reference.py
