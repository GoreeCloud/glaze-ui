name: Glaze UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile validators
        run: python3 -m py_compile scripts/validate_glaze_ui.py scripts/validate_release_state.py scripts/validate_enforcement.py scripts/validate_form_factors.py scripts/validate_consumer_registry.py scripts/validate_typography_contract.py scripts/validate_adaptive_colors.py scripts/validate_iconography.py scripts/validate_motion.py scripts/validate_rendered_reference.py website/build.py website/validate.py integrations/firefox/validate.py
      - name: Validate Glaze UI repository
        run: python3 scripts/validate_glaze_ui.py
      - name: Validate canonical release state
        run: python3 scripts/validate_release_state.py
      - name: Validate full-spectrum Glaze UI enforcement
        run: python3 scripts/validate_enforcement.py
      - name: Validate Glaze UI 1.4 form-factor contract
        run: python3 scripts/validate_form_factors.py
      - name: Validate Glaze UI 1.5 adaptive color Candidate
        run: python3 scripts/validate_adaptive_colors.py
      - name: Validate Glaze UI 1.5 iconography Candidate
        run: python3 scripts/validate_iconography.py
      - name: Validate Glaze UI 1.5 motion and interaction Candidate
        run: python3 scripts/validate_motion.py
      - name: Validate typography source contract
        run: python3 scripts/validate_typography_contract.py
      - name: Validate consumer compatibility registry
        run: python3 scripts/validate_consumer_registry.py
      - name: Validate Firefox integration
        run: python3 integrations/firefox/validate.py
      - name: Build and validate public design site
        run: python3 website/validate.py
      - name: Validate rendered Glaze UI reference
        run: python3 scripts/validate_rendered_reference.py
