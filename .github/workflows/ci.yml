name: GLAZE UI V1.0 CI

on:
  push:
  pull_request:

jobs:
  validate-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GLAZE UI V1.0 reset contract
        run: python scripts/validate_glaze_v1.py
      - name: Validate V1 Design Center publication
        run: python website/validate.py
      - name: Check V1 runtime syntax
        run: node --check js/glaze-v1.0.0.mjs
