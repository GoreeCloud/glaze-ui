name: Glaze UI Current Stable CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-current-stable-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate GitHub Actions runtime and immutable pin integrity
        run: |
          python -m py_compile scripts/validate_github_actions_runtime_integrity.py
          python scripts/validate_github_actions_runtime_integrity.py

      - name: Validate current Stable lifecycle and optical authority
        run: |
          node --check js/glaze-v1.4-optical-engine.mjs
          node --check js/glaze-v1.4.0.mjs
          node --check scripts/verify_glaze_v1_4_stable.mjs
          node scripts/verify_glaze_v1_4_stable.mjs

      - name: Validate current consumer authority
        run: |
          python -m py_compile scripts/validate_consumer_summary.py
          python scripts/validate_consumer_summary.py

      - name: Validate current Stable CSS import closure
        run: |
          python -m py_compile scripts/validate_css_import_closure.py
          python scripts/validate_css_import_closure.py

      - name: Parse current machine authorities
        run: |
          python -m json.tool registry/lifecycle.json >/dev/null
          python -m json.tool consumers/registry.json >/dev/null

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code

      - name: Report authority boundary
        run: |
          echo 'Current Stable CI verifies shared Glaze UI machine authority only.'
          echo 'Historical releases remain covered by their dedicated regression workflows.'
          echo 'Human/manual/physical-device V1.4.1 qualification is not represented as passed by this workflow.'

  validate-v1-2-linux-gtk-historical-branch:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'feat/glaze-v1.2-linux-native') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/glaze-v1.2-linux-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact historical branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile Linux native V1.2 sources
        run: |
          python3 -m py_compile reference/v1.2/native/linux-gtk/app.py
          python3 -m py_compile scripts/validate_glaze_v1_2_linux_runtime.py
          python3 -m json.tool reference/v1.2/native/linux-gtk/material-contract.json >/dev/null
      - name: Run V1.2 Linux GTK4 Frosted Neutral native regression
        shell: bash
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          NO_AT_BRIDGE: '1'
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 \
            xvfb \
            xauth \
            dbus-x11 \
            imagemagick
          dbus-run-session -- xvfb-run -a --server-args='-screen 0 1280x900x24 -nolisten tcp' \
            python3 scripts/validate_glaze_v1_2_linux_runtime.py
      - name: Upload V1.2 Linux GTK historical evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-linux-gtk-historical-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/glaze-v1.2-linux-native/*.png
            .artifacts/glaze-v1.2-linux-native/linux-native-evidence.json
            .artifacts/glaze-v1.2-linux-native/*/runtime.json
          if-no-files-found: error
          retention-days: 30
