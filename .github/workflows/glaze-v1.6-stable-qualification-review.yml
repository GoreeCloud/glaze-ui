name: GLAZE UI V1.6 Stable Qualification Review

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'registry/lifecycle.json'
      - 'acceptance/v1.6-stable-qualification-review.json'
      - 'acceptance/v1.6-qualification-review.json'
      - 'acceptance/v1.6-production-readiness-review.json'
      - 'scripts/verify_glaze_v1_6_stable_qualification_review.mjs'
      - '.github/workflows/glaze-v1.6-stable-qualification-review.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'registry/lifecycle.json'
      - 'acceptance/v1.6-stable-qualification-review.json'
      - 'acceptance/v1.6-qualification-review.json'
      - 'acceptance/v1.6-production-readiness-review.json'
      - 'scripts/verify_glaze_v1_6_stable_qualification_review.mjs'
      - '.github/workflows/glaze-v1.6-stable-qualification-review.yml'

permissions:
  contents: read

concurrency:
  group: glaze-v1.6-stable-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable-qualification-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact review revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact review head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate Stable qualification review record
        run: |
          node --check scripts/verify_glaze_v1_6_stable_qualification_review.mjs
          node scripts/verify_glaze_v1_6_stable_qualification_review.mjs

      - name: Preserve V1.6 Release Candidate authority
        run: node scripts/verify_glaze_v1_6_release_candidate.mjs

      - name: Preserve V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
