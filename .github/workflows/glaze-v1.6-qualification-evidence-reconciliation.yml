name: Glaze UI V1.6 Qualification Evidence Reconciliation

on:
  pull_request:
    paths:
      - 'contracts/v1.6/qualification-evidence-intake.json'
      - 'schemas/v1.6-qualification-evidence-intake.schema.json'
      - 'scripts/evaluate_glaze_v1_6_qualification_evidence.mjs'
      - 'scripts/validate_glaze_v1_6_external_evidence_records.mjs'
      - 'acceptance/v1.6-machine-evidence.json'
      - 'acceptance/v1.6-rendered-evidence.json'
      - 'acceptance/v1.6-regression-evidence.json'
      - 'acceptance/v1.6-human-evidence.json'
      - 'acceptance/v1.6-assistive-technology-evidence.json'
      - 'acceptance/v1.6-performance-evidence.json'
      - 'acceptance/v1.6-human-evidence.template.json'
      - 'acceptance/v1.6-assistive-technology-evidence.template.json'
      - 'acceptance/v1.6-performance-evidence.template.json'
      - 'contracts/v1.6/acceptance.dev.json'
      - 'acceptance/v1.6-development.md'
      - 'README.md'
      - 'FEATURE-ROADMAP.md'
      - '.github/workflows/glaze-v1.6-qualification-evidence-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-6-evidence-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-qualification-evidence-reconciliation:
    name: Verify V1.6 qualification evidence reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision and frozen source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "c7509c79256b04b0aa67cb9dd0737d7588e0ae4a^{commit}"
          git merge-base --is-ancestor c7509c79256b04b0aa67cb9dd0737d7588e0ae4a HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Syntax-check evidence reconciler
        run: node --check scripts/evaluate_glaze_v1_6_qualification_evidence.mjs

      - name: Reconcile current canonical evidence
        run: |
          set -euo pipefail
          node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs > /tmp/v16-evidence-reconciliation.json
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('/tmp/v16-evidence-reconciliation.json','utf8'));
          if(result.matrix.verifiedCount!==17) throw new Error('expected 17 currently verified lanes');
          if(result.matrix.unverifiedCount!==7) throw new Error('expected 7 currently unverified lanes');
          if(result.matrix.qualificationEvidenceComplete!==false) throw new Error('current evidence must remain incomplete');
          if(result.matrix.readyForGovernedQualificationReview!==false) throw new Error('current evidence must not be review-ready');
          if(result.externalEvidenceItemCount!==0) throw new Error('current canonical evaluation must not invent external evidence');
          console.log('Current V1.6 evidence reconciliation: 17 verified / 7 unverified');
          NODE

      - name: Reconcile committed accepted external evidence when present
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for record in \
            acceptance/v1.6-human-evidence.json \
            acceptance/v1.6-assistive-technology-evidence.json \
            acceptance/v1.6-performance-evidence.json
          do
            if [[ -f "$record" ]]; then args+=(--external "$record"); fi
          done
          node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs "${args[@]}" > /tmp/v16-evidence-with-accepted-external.json
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('/tmp/v16-evidence-with-accepted-external.json','utf8'));
          const present={
            human:fs.existsSync('acceptance/v1.6-human-evidence.json'),
            assistive:fs.existsSync('acceptance/v1.6-assistive-technology-evidence.json'),
            performance:fs.existsSync('acceptance/v1.6-performance-evidence.json')
          };
          const byId=new Map(result.matrix.lanes.map(lane=>[lane.id,lane]));
          if(present.human){
            for(const id of ['accessibility','keyboard-navigation','privacy-boundaries','authority-boundaries','representative-rendering']){
              if(byId.get(id)?.status!=='verified') throw new Error('accepted Human record did not verify '+id);
            }
          }
          if(present.assistive&&byId.get('assistive-technology')?.status!=='verified') throw new Error('accepted Assistive Technology record did not verify dedicated lane');
          if(present.performance&&byId.get('performance')?.status!=='verified') throw new Error('accepted Performance record did not verify Performance lane');
          if(present.human&&!present.assistive&&!present.performance){
            if(result.matrix.verifiedCount!==22||result.matrix.unverifiedCount!==2) throw new Error('Human-only reconciliation must be 22 verified / 2 unverified');
            if(JSON.stringify(result.matrix.blockingLaneIds)!==JSON.stringify(['assistive-technology','performance'])) throw new Error('Human-only blocker set must be Assistive Technology + Performance');
          }
          if(present.human&&present.assistive&&present.performance){
            if(result.matrix.qualificationEvidenceComplete!==true||result.matrix.readyForGovernedQualificationReview!==true) throw new Error('all three accepted external record types must complete the evidence matrix');
          }
          console.log('Accepted external evidence reconciliation verified');
          NODE

      - name: Prove incomplete evidence fails the completion gate
        run: |
          set -euo pipefail
          if node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs --require-complete > /tmp/should-not-complete.json 2> /tmp/should-not-complete.err; then
            echo "Evidence reconciliation unexpectedly reported qualification complete"
            exit 1
          fi
          grep -q "V1.6 qualification evidence remains incomplete" /tmp/should-not-complete.err

      - name: Reject external evidence outside governed acceptance records
        run: |
          set -euo pipefail
          cp acceptance/v1.6-human-evidence.template.json /tmp/v1.6-human-outside-repository.json
          if node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs --external /tmp/v1.6-human-outside-repository.json > /tmp/outside-evidence.json 2> /tmp/outside-evidence.err; then
            echo "Evidence reconciliation unexpectedly accepted an out-of-repository record"
            exit 1
          fi
          grep -q "external evidence must resolve inside the governed repository" /tmp/outside-evidence.err

          ln -s /tmp/v1.6-human-outside-repository.json acceptance/.v1.6-outside-evidence-test.json
          if node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs --external acceptance/.v1.6-outside-evidence-test.json > /tmp/symlink-evidence.json 2> /tmp/symlink-evidence.err; then
            echo "Evidence reconciliation unexpectedly accepted an escaping symlink"
            exit 1
          fi
          grep -q "external evidence must resolve inside the governed repository" /tmp/symlink-evidence.err
          rm acceptance/.v1.6-outside-evidence-test.json

          cp acceptance/v1.6-human-evidence.template.json .v1.6-inside-repository-outside-acceptance.json
          if node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs --external .v1.6-inside-repository-outside-acceptance.json > /tmp/outside-acceptance.json 2> /tmp/outside-acceptance.err; then
            echo "Evidence reconciliation unexpectedly accepted a record outside acceptance/"
            exit 1
          fi
          grep -q "durable repository record under acceptance/" /tmp/outside-acceptance.err
          rm .v1.6-inside-repository-outside-acceptance.json

          cp acceptance/v1.6-human-evidence.template.json acceptance/.v1.6-untracked-evidence-test.json
          if node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs --external acceptance/.v1.6-untracked-evidence-test.json > /tmp/untracked-evidence.json 2> /tmp/untracked-evidence.err; then
            echo "Evidence reconciliation unexpectedly accepted an untracked acceptance record"
            exit 1
          fi
          grep -q "tracked by Git at the exact reconciliation revision" /tmp/untracked-evidence.err
          rm acceptance/.v1.6-untracked-evidence-test.json

      - name: Preserve external record and acceptance controls
        run: |
          node scripts/validate_glaze_v1_6_external_evidence_records.mjs
          node scripts/validate_glaze_v1_6_acceptance_development.mjs

      - name: Preserve V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
