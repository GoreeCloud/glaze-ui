name: Glaze V1.2 Exact-Head Historical Regression

on:
  push:
    branches: [main]
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "contracts/v1.2/**"
      - "contracts/v1.3/deferred-qualification.plan.json"
      - "contracts/v1.3/stable-readiness.plan.json"
      - "tokens/glaze-v1.2-**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "acceptance/v1.2-**"
      - "acceptance/v1.3-deferred-qualification.md"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_candidate.py"
      - "scripts/validate_glaze_v1_2_candidate_legacy.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_living_glaze.py"
      - "scripts/validate_glaze_v1_2_living_glaze_legacy.py"
      - "scripts/glaze_v1_2_promoted_source_runner.py"
      - ".github/workflows/glaze-v1.2-exact-head-readiness.yml"
  pull_request:
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "contracts/v1.2/**"
      - "contracts/v1.3/deferred-qualification.plan.json"
      - "contracts/v1.3/stable-readiness.plan.json"
      - "tokens/glaze-v1.2-**"
      - "css/glaze-v1.2-**"
      - "js/glaze-v1.2-**"
      - "reference/v1.2/**"
      - "acceptance/v1.2-**"
      - "acceptance/v1.3-deferred-qualification.md"
      - "scripts/validate_glaze_v1.py"
      - "scripts/validate_glaze_v1_2_candidate.py"
      - "scripts/validate_glaze_v1_2_candidate_legacy.py"
      - "scripts/validate_glaze_v1_2_stable.py"
      - "scripts/validate_glaze_v1_2_living_glaze.py"
      - "scripts/validate_glaze_v1_2_living_glaze_legacy.py"
      - "scripts/glaze_v1_2_promoted_source_runner.py"
      - ".github/workflows/glaze-v1.2-exact-head-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-historical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Verify exact revision and current lifecycle consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/validate_glaze_v1_2_stable.py
          python scripts/validate_glaze_v1.py

      - name: Validate promoted V1.2 source layer
        run: |
          python scripts/validate_glaze_v1_2_candidate.py
          python scripts/validate_glaze_v1_2_living_glaze.py

      - name: Verify preserved V1.3/V1.3.1 qualification provenance without manufacturing evidence
        env:
          GLAZE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.')
          lifecycle = json.loads((root / 'registry/lifecycle.json').read_text(encoding='utf-8'))
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          follow_up = json.loads((root / 'contracts/v1.3/deferred-qualification.plan.json').read_text(encoding='utf-8'))
          historical_stable_plan = json.loads((root / 'contracts/v1.3/stable-readiness.plan.json').read_text(encoding='utf-8'))

          assert lifecycle.get('currentStable') == version
          assert lifecycle.get('currentOfficial') == version

          v12 = next(item for item in lifecycle.get('releases', []) if item.get('version') == '1.2.0')
          v13 = next(item for item in lifecycle.get('releases', []) if item.get('version') == '1.3.0')
          assert v12.get('status') == 'stable'
          assert v12.get('consumerEligible') is True
          assert v12.get('stableBaseline') == '1.1.0'
          assert v12.get('contract') == 'GLAZE_UI_V1_2.md'
          assert v13.get('status') == 'stable'
          assert v13.get('consumerEligible') is True

          assert follow_up.get('schemaVersion') == 5
          assert follow_up.get('sourceStable') == '1.3.0'
          assert follow_up.get('targetVersion') == '1.3.1-candidate'
          assert follow_up.get('lifecycle') == 'follow-up-active'
          assert follow_up.get('controlPlane', {}).get('status') == 'v1.3.1-follow-up-active'
          assert len(follow_up.get('followUpItems', [])) == 6
          assert len(follow_up.get('legacyCandidateStageItems', [])) == 5
          assert follow_up.get('legacyStableStageItems') == ['stable-activation-and-source-namespace-cleanup']

          rules = follow_up.get('rules', {})
          assert rules.get('v1.3.0StableAuthorityActive') is True
          assert rules.get('v1.3.0ConsumerEligible') is True
          assert rules.get('theseItemsBlockV1.3.0StableAuthority') is False
          assert rules.get('theseItemsMayBeRepresentedAsPassedWithoutEvidence') is False
          assert rules.get('freshExactRevisionEvidenceRequiredForFuturePassClaims') is True
          assert rules.get('automatedValidationMayReplaceHumanOpticalReview') is False
          assert rules.get('automatedValidationMayReplacePhysicalDeviceReview') is False
          assert rules.get('consumerConformanceAutomatic') is False
          assert rules.get('v1.3.1LifecyclePromotionAutomatic') is False
          assert rules.get('allSixRemainV1.3.1FollowUpObligations') is True

          # Preserve the historical V1.3.0 promotion plan as provenance. It is
          # no longer live lifecycle authority after V1.3.0 Stable promotion.
          assert historical_stable_plan.get('schemaVersion') == 2
          assert historical_stable_plan.get('sourceStable') == '1.2.0'
          assert historical_stable_plan.get('candidateVersion') == '1.3.0-candidate'
          assert historical_stable_plan.get('stableVersion') == '1.3.0'
          assert historical_stable_plan.get('lifecycleAuthority') is False
          assert historical_stable_plan.get('stablePromotion', {}).get('automatic') is False
          assert historical_stable_plan.get('stablePromotion', {}).get('consumerConformanceAutomatic') is False

          report = {
              'schemaVersion': 5,
              'status': 'pass',
              'repository': 'GoreeCloud/goreecloud-glaze-ui',
              'revision': os.environ['GLAZE_SOURCE_REVISION'],
              'currentLifecycle': {
                  'version': version,
                  'currentStable': lifecycle.get('currentStable'),
                  'currentOfficial': lifecycle.get('currentOfficial'),
              },
              'historicalV1.2': {
                  'version': '1.2.0',
                  'status': v12.get('status'),
                  'consumerEligibleAtRelease': v12.get('consumerEligible'),
                  'rollbackBaseline': v12.get('stableBaseline'),
                  'representedAsCurrent': False,
              },
              'historicalV1.3': {
                  'version': '1.3.0',
                  'status': v13.get('status'),
                  'consumerEligibleAtRelease': v13.get('consumerEligible'),
                  'representedAsCurrent': False,
              },
              'v1.3.1FollowUp': {
                  'targetVersion': follow_up.get('targetVersion'),
                  'recordedLifecycle': follow_up.get('lifecycle'),
                  'followUpObligationCount': len(follow_up.get('followUpItems', [])),
                  'representedAsPassedWithoutEvidence': False,
                  'freshExactRevisionEvidenceRequired': True,
                  'lifecyclePromotionImpliedNow': False,
              },
              'downstreamConsumerAcceptanceImplied': False,
              'authorityBoundary': 'Historical V1.2/V1.3 records and the V1.3.1 follow-up remain provenance/obligations only; live lifecycle authority remains VERSION + registry/lifecycle.json.',
          }
          out = root / 'artifacts/glaze-v1.2-exact-head-historical-regression.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('GLAZE UI V1.2 exact-head historical regression: PASS')
          print(f'Current lifecycle remains {version}; V1.2/V1.3 provenance and V1.3.1 unresolved obligations remain explicit without reactivation or manufactured evidence.')
          PY

      - name: Verify regression did not mutate tracked source
        run: git diff --exit-code

      - name: Upload exact-head historical regression evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.2-exact-head-historical-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-v1.2-exact-head-historical-regression.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
