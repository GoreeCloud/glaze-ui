name: GLAZE UI V1.4.1 Optical Runtime Hardening

on:
  pull_request:
    paths:
      - 'contracts/v1.4.1/optical-runtime-hardening.contract.json'
      - 'js/glaze-v1.4.1-optical-engine.candidate.mjs'
      - 'js/glaze-v1.4.1.candidate.mjs'
      - 'css/glaze-v1.4.1.candidate.css'
      - 'tests/glaze-v1.4.1-capability-aware-performance.test.mjs'
      - 'reference/v1.4.1/session-005-capability-aware-retest.html'
      - 'scripts/verify_glaze_v1_4_1_optical_runtime.mjs'
      - 'GLAZE_UI_V1_4_1_HARDENING.md'
      - '.github/workflows/glaze-v1.4.1-optical-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/v1.4.1/optical-runtime-hardening.contract.json'
      - 'js/glaze-v1.4.1-optical-engine.candidate.mjs'
      - 'js/glaze-v1.4.1.candidate.mjs'
      - 'css/glaze-v1.4.1.candidate.css'
      - 'tests/glaze-v1.4.1-capability-aware-performance.test.mjs'
      - 'reference/v1.4.1/session-005-capability-aware-retest.html'
      - 'scripts/verify_glaze_v1_4_1_optical_runtime.mjs'
      - 'GLAZE_UI_V1_4_1_HARDENING.md'
      - '.github/workflows/glaze-v1.4.1-optical-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optical-runtime-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check candidate runtime syntax
        run: |
          node --check js/glaze-v1.4.1-optical-engine.candidate.mjs
          node --check js/glaze-v1.4.1.candidate.mjs
          node --check scripts/verify_glaze_v1_4_1_optical_runtime.mjs

      - name: Verify V1.4.1 optical runtime hardening
        run: node scripts/verify_glaze_v1_4_1_optical_runtime.mjs

      - name: Verify capability-aware performance contract
        run: node --test tests/glaze-v1.4.1-capability-aware-performance.test.mjs

      - name: Preserve V1.4.0 Stable machine authority
        run: node scripts/verify_glaze_v1_4_stable.mjs

      - name: Preserve V1.4.1 human-evidence protocol boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
          CURRENT_STABLE="$(node -p "require('./registry/lifecycle.json').currentStable")"
          if [[ "${CURRENT_STABLE}" == "1.4.0" || "${CURRENT_STABLE}" == "1.4.1" ]]; then
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
          else
            node -e "const a=require('node:assert/strict'),l=require('./registry/lifecycle.json'),v140=l.releases.find(x=>x.version==='1.4.0'),v141=l.releases.find(x=>x.version==='1.4.1');a.equal(l.currentOfficial,l.currentStable);a.ok(v140);a.equal(v140.status,'stable');a.ok(v141);a.equal(v141.status,'stable');a.equal(v141.consumerEligible,true);a.equal(v141.stableBaseline,'1.4.0');if(l.currentStable==='1.5.0'){const v150=l.releases.find(x=>x.version==='1.5.0');a.ok(v150);a.equal(v150.status,'stable');a.equal(v150.stableBaseline,'1.4.1')}console.log('V1.4.1 human-evidence protocol retained as historical provenance under current Stable '+l.currentStable+'.')"
          fi

      - name: Report non-claim boundary
        run: |
          echo 'V1.4.1 optical runtime hardening remains historical machine-verifiable provenance when a later Stable release is current.'
          echo 'This workflow does not manufacture new human, physical-device, assistive-technology, performance, or subjective optical acceptance.'
          echo 'V1.4.0 and V1.4.1 Stable source/evidence remain separately auditable and do not override current lifecycle authority.'
