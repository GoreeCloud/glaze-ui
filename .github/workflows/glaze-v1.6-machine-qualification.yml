name: Glaze UI V1.6 Machine Qualification

on:
  pull_request:
    paths:
      - 'contracts/v1.6/qualification.machine.plan.json'
      - 'schemas/v1.6-machine-qualification-plan.schema.json'
      - 'scripts/qualify_glaze_v1_6_machine_source.mjs'
      - '.github/workflows/glaze-v1.6-machine-qualification.yml'
      - 'acceptance/v1.6-machine-evidence.json'
      - 'acceptance/v1.6-development.md'
  push:
    branches: [main]
    paths:
      - 'contracts/v1.6/qualification.machine.plan.json'
      - 'schemas/v1.6-machine-qualification-plan.schema.json'
      - 'scripts/qualify_glaze_v1_6_machine_source.mjs'
      - '.github/workflows/glaze-v1.6-machine-qualification.yml'
      - 'acceptance/v1.6-machine-evidence.json'
      - 'acceptance/v1.6-development.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-6-machine-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exact-source-machine-qualification:
    name: Qualify frozen V1.6 source machine evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out qualification tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate qualification control syntax
        run: |
          python -m json.tool contracts/v1.6/qualification.machine.plan.json >/dev/null
          python -m json.tool schemas/v1.6-machine-qualification-plan.schema.json >/dev/null
          node --check scripts/qualify_glaze_v1_6_machine_source.mjs
      - name: Materialize exact frozen V1.6 source
        run: |
          git worktree add --detach /tmp/glaze-v1-6-qualification-source c7509c79256b04b0aa67cb9dd0737d7588e0ae4a
          test "$(git -C /tmp/glaze-v1-6-qualification-source rev-parse HEAD)" = "c7509c79256b04b0aa67cb9dd0737d7588e0ae4a"
      - name: Run exact-source machine qualification
        run: node scripts/qualify_glaze_v1_6_machine_source.mjs /tmp/glaze-v1-6-qualification-source
