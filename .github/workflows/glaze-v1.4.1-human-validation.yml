name: GLAZE UI V1.4.1 Human Validation Protocol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-human-evidence-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check verifier syntax
        run: node --check scripts/verify_glaze_v1_4_1_human_validation.mjs
      - name: Validate V1.4.1 protocol authority
        run: node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
      - name: Exercise fail-closed synthetic protocol tests
        run: node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
      - name: Preserve V1.4.0 Stable authority
        run: node scripts/verify_glaze_v1_4_stable.mjs
