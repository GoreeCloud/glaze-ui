name: GLAZE UI V1.4.1 Human Validation Protocol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-human-evidence-protocol:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Check verifier syntax
        run: |
          node --check scripts/verify_glaze_v1_4_1_human_validation.mjs
          node --check scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
      - name: Validate V1.4.1 evidence schema parity
        run: node scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
      - name: Validate active or historical V1.4.1 authority
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_STABLE="$(node -p "require('./registry/lifecycle.json').currentStable")"
          if [[ "${CURRENT_STABLE}" == "1.4.0" || "${CURRENT_STABLE}" == "1.4.1" ]]; then
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
          else
            node -e "const a=require('node:assert/strict'),l=require('./registry/lifecycle.json'),r=v=>l.releases.find(x=>x.version===v);a.equal(l.currentOfficial,l.currentStable);const v140=r('1.4.0'),v141=r('1.4.1');a.ok(v140);a.equal(v140.status,'stable');a.ok(v141);a.equal(v141.status,'stable');a.equal(v141.stableBaseline,'1.4.0');a.equal(v141.consumerEligible,true);if(l.currentStable==='1.5.0'){const v150=r('1.5.0');a.ok(v150);a.equal(v150.status,'stable');a.equal(v150.stableBaseline,'1.4.1')}console.log('GLAZE UI V1.4.1 protocol retained as historical Stable provenance under current Stable '+l.currentStable+'.')"
          fi
      - name: Preserve historical V1.4.0 authority record
        run: node -e "const a=require('node:assert/strict'),l=require('./registry/lifecycle.json'),v=l.releases.find(x=>x.version==='1.4.0');a.ok(v);a.equal(v.status,'stable');a.equal(v.stableBaseline,'1.3.0');a.equal(v.sourceIntegrationAnchor,'a20374734dae6a119b28448f5e6b3232253b6da7');console.log('GLAZE UI V1.4.0 historical Stable provenance preserved.')"
