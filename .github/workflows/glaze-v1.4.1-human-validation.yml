name: GLAZE UI V1.4.1 Human Validation Protocol

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-human-evidence-protocol:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Check verifier syntax
        run: |
          node --check scripts/verify_glaze_v1_4_1_human_validation.mjs
          node --check scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
      - name: Validate V1.4.1 evidence schema parity
        run: node scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
      - name: Validate active or historical V1.4.1 authority
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_STABLE="$(node -p "require('./registry/lifecycle.json').currentStable")"
          if [[ "${CURRENT_STABLE}" == "1.4.0" || "${CURRENT_STABLE}" == "1.4.1" ]]; then
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
          else
            node <<'NODE'
            const assert = require('node:assert/strict');
            const lifecycle = require('./registry/lifecycle.json');
            assert.equal(lifecycle.currentOfficial, lifecycle.currentStable,
              'current Official and Stable authorities must remain aligned');
            const v140 = lifecycle.releases.find(item => item.version === '1.4.0');
            const v141 = lifecycle.releases.find(item => item.version === '1.4.1');
            assert.ok(v140, 'historical lifecycle must retain the 1.4.0 release record');
            assert.equal(v140.status, 'stable', 'historical 1.4.0 record must remain Stable provenance');
            assert.ok(v141, 'historical lifecycle must retain the 1.4.1 release record');
            assert.equal(v141.status, 'stable', 'historical 1.4.1 record must remain Stable provenance');
            assert.equal(v141.stableBaseline, '1.4.0', 'historical 1.4.1 record must preserve its 1.4.0 baseline');
            assert.equal(v141.consumerEligible, true, 'historical 1.4.1 Stable record must remain consumer-eligible provenance');
            if (lifecycle.currentStable === '1.5.0') {
              const v150 = lifecycle.releases.find(item => item.version === '1.5.0');
              assert.ok(v150, 'current lifecycle must contain the 1.5.0 release record');
              assert.equal(v150.status, 'stable', 'current 1.5.0 record must be Stable');
              assert.equal(v150.stableBaseline, '1.4.1', '1.5.0 must preserve 1.4.1 as its rollback baseline');
            }
            console.log(`GLAZE UI V1.4.1 protocol retained as historical Stable provenance under current Stable ${lifecycle.currentStable}.`);
            NODE
          fi
      - name: Preserve historical V1.4.0 authority record
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const lifecycle = require('./registry/lifecycle.json');
          const v140 = lifecycle.releases.find(item => item.version === '1.4.0');
          assert.ok(v140, 'lifecycle must retain V1.4.0');
          assert.equal(v140.status, 'stable');
          assert.equal(v140.stableBaseline, '1.3.0');
          assert.equal(v140.sourceIntegrationAnchor, 'a20374734dae6a119b28448f5e6b3232253b6da7');
          console.log('GLAZE UI V1.4.0 historical Stable provenance preserved.');
          NODE
