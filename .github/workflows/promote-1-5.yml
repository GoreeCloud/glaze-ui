name: One-shot Glaze UI 1.5 Stable promotion

on:
  push:
    branches:
      - agent/glaze-motion-interaction-2026-08-25

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out promotion source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-motion-interaction-2026-08-25
          fetch-depth: 0
      - name: Prepare Stable release state
        run: python3 scripts/promote_1_5.py
      - name: Commit atomic Stable promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'promotion produced no changes'; exit 1; }
          git commit -m 'Promote Glaze UI 1.5.0 to Stable'
          git push origin HEAD:agent/glaze-motion-interaction-2026-08-25
