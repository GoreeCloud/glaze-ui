name: One-shot Glaze UI 1.5 Stable promotion

on:
  push:
    branches:
      - agent/glaze-motion-interaction-2026-08-25

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out promotion source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-motion-interaction-2026-08-25
          fetch-depth: 0
      - name: Prepare Stable release state without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/promote_1_5.py')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(
              r'\n    # Workflow labels become Stable.*?\n    # Preserve exact Candidate record',
              '\n    # Preserve exact Candidate record',
              text,
              count=1,
              flags=re.S,
          )
          text, n2 = re.subn(
              r'\n    # Remove the one-shot promotion machinery.*?\n    print\("Glaze UI 1\.5\.0 release-state conversion prepared"\)',
              '\n    print("Glaze UI 1.5.0 release-state conversion prepared")',
              text,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'promotion script isolation patch failed: workflow={n1} cleanup={n2}')
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/promote_1_5.py
          git checkout -- scripts/promote_1_5.py .github/workflows/promote-1-5.yml
      - name: Commit atomic Stable promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'promotion produced no changes'; exit 1; }
          git commit -m 'Promote Glaze UI 1.5.0 to Stable'
          git push origin HEAD:agent/glaze-motion-interaction-2026-08-25
