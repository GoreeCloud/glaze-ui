name: GLAZE UI V1.5.1 Stable Authority

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'registry/lifecycle.json'
      - 'consumers/registry.json'
      - 'CONSUMERS.md'
      - 'README.md'
      - 'FEATURES.md'
      - 'SPECIFICATIONS.md'
      - 'CONTRIBUTING.md'
      - 'ADOPTION.md'
      - 'ENFORCEMENT.md'
      - 'website/README.md'
      - 'ICON_CONSTRUCTION.md'
      - 'ICON_IDENTITY.md'
      - 'STABILITY.md'
      - 'ACCEPTANCE.md'
      - 'CONFORMANCE.md'
      - 'FEATURE-ROADMAP.md'
      - 'GLAZE_UI_V1_5_1_HARDENING.md'
      - 'acceptance/v1.5.1-stable.md'
      - 'contracts/v1.5.1/**'
      - 'js/glaze-v1.5.1.mjs'
      - 'scripts/verify_glaze_v1_5_1_stable.mjs'
      - 'scripts/verify_glaze_v1_5_stable.mjs'
      - 'scripts/verify_glaze_v1_5_1_release_candidate.mjs'
      - '.github/workflows/glaze-v1.5-stable.yml'
      - '.github/workflows/glaze-v1.5.1-release-candidate.yml'
      - '.github/workflows/glaze-v1.5.1-stable.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'registry/lifecycle.json'
      - 'consumers/registry.json'
      - 'CONSUMERS.md'
      - 'README.md'
      - 'FEATURES.md'
      - 'SPECIFICATIONS.md'
      - 'CONTRIBUTING.md'
      - 'ADOPTION.md'
      - 'ENFORCEMENT.md'
      - 'website/README.md'
      - 'ICON_CONSTRUCTION.md'
      - 'ICON_IDENTITY.md'
      - 'STABILITY.md'
      - 'ACCEPTANCE.md'
      - 'CONFORMANCE.md'
      - 'FEATURE-ROADMAP.md'
      - 'GLAZE_UI_V1_5_1_HARDENING.md'
      - 'acceptance/v1.5.1-stable.md'
      - 'contracts/v1.5.1/**'
      - 'js/glaze-v1.5.1.mjs'
      - 'scripts/verify_glaze_v1_5_1_stable.mjs'
      - 'scripts/verify_glaze_v1_5_stable.mjs'
      - 'scripts/verify_glaze_v1_5_1_release_candidate.mjs'
      - '.github/workflows/glaze-v1.5-stable.yml'
      - '.github/workflows/glaze-v1.5.1-release-candidate.yml'
      - '.github/workflows/glaze-v1.5.1-stable.yml'

permissions:
  contents: read

concurrency:
  group: glaze-v1.5.1-stable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REVIEWED_V15_IMPLEMENTATION_SHA: ee1032a0822ab8e103f8afe48e5c1859fde65cc9
  QUALIFIED_V151_SHA: 5b59d0e36950d737dba35b58ae58058684e0831b
  RC_INTEGRATION_SHA: a9c93506dd062d29c6c894940b71d060e8c39110

jobs:
  stable-authority:
    name: Verify V1.5.1 Stable authority and continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact promotion revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact revision and governed ancestry
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git cat-file -e "${REVIEWED_V15_IMPLEMENTATION_SHA}^{commit}"
          git cat-file -e "${QUALIFIED_V151_SHA}^{commit}"
          git cat-file -e "${RC_INTEGRATION_SHA}^{commit}"
          git merge-base --is-ancestor "${REVIEWED_V15_IMPLEMENTATION_SHA}" HEAD
          git merge-base --is-ancestor "${QUALIFIED_V151_SHA}" HEAD
          git merge-base --is-ancestor "${RC_INTEGRATION_SHA}" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify reviewed V1.5 implementation remains byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${REVIEWED_V15_IMPLEMENTATION_SHA}" -- \
            js/glaze-v1.5-actions.dev.mjs \
            js/glaze-v1.5-composition.dev.mjs \
            js/glaze-v1.5-context-capability.dev.mjs \
            js/glaze-v1.5-diagnostics.dev.mjs \
            js/glaze-v1.5-provider-registry.dev.mjs \
            js/glaze-v1.5-resolution.dev.mjs \
            js/glaze-v1.5.dev.mjs \
            reference/v1.5/human-review-v2.html \
            contracts/v1.5/context-capability.dev.json \
            contracts/v1.5/human-review-harness.dev.json \
            contracts/v1.5/representative-consumers.dev.json \
            contracts/v1.5/stabilization-review.dev.json \
            conformance/v1.5-action-development-matrix.json \
            conformance/v1.5-consumer-integration-development-matrix.json \
            conformance/v1.5-development-matrix.json \
            conformance/v1.5-diagnostics-development-matrix.json \
            conformance/v1.5-resolution-development-matrix.json

      - name: Verify frozen V1.5.1 qualification sources remain byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${QUALIFIED_V151_SHA}" -- \
            contracts/v1.5.1/qualification.dev.json \
            contracts/v1.5.1/performance-qualification-harness.dev.json \
            contracts/v1.5.1/posture-qualification-harness.dev.json \
            reference/v1.5.1/performance-qualification.html \
            reference/v1.5.1/posture-qualification.html \
            scripts/verify_glaze_v1_5_1_performance_qualification_harness.mjs \
            scripts/verify_glaze_v1_5_1_posture_qualification_harness.mjs \
            .github/workflows/glaze-v1.5.1-qualification.yml

      - name: Verify integrated RC evidence remains immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${RC_INTEGRATION_SHA}" -- \
            contracts/v1.5.1/release-candidate.json \
            acceptance/v1.5.1-rc.1.md \
            js/glaze-v1.5.1-rc.1.mjs

      - name: Syntax-check Stable and retained-history verifiers
        run: |
          node --check scripts/verify_glaze_v1_5_1_stable.mjs
          node --check scripts/verify_glaze_v1_5_stable.mjs
          node --check scripts/verify_glaze_v1_5_1_release_candidate.mjs

      - name: Verify retained V1.5.0 Stable integrity
        run: node scripts/verify_glaze_v1_5_stable.mjs

      - name: Verify retained V1.5.1 RC integrity
        run: node scripts/verify_glaze_v1_5_1_release_candidate.mjs

      - name: Verify qualification capture tooling remains bounded
        run: |
          node scripts/verify_glaze_v1_5_1_performance_qualification_harness.mjs
          node scripts/verify_glaze_v1_5_1_posture_qualification_harness.mjs

      - name: Verify V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Validate current Stable consumer registry
        run: python3 scripts/validate_consumer_registry.py

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
