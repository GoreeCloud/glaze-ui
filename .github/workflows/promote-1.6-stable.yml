name: Promote Glaze UI 1.6 Stable branch

on:
  push:
    branches:
      - agent/glaze-ui-1.6-stable-promotion

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[promotion-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-ui-1.6-stable-promotion
          persist-credentials: true
      - name: Reconcile promotion converter with current source anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/promote_1_6_stable.py')
          body = path.read_text(encoding='utf-8')

          helper_old = '''    if old not in body:\n        if required:\n            raise SystemExit(f"promotion replacement missing in {path}: {old!r}")\n        return\n    write(path, body.replace(old, new))\n'''
          helper_new = '''    if old not in body:\n        if new in body:\n            return\n        if required:\n            raise SystemExit(f"promotion replacement missing in {path}: {old!r}")\n        return\n    write(path, body.replace(old, new))\n'''
          if helper_old in body:
              body = body.replace(helper_old, helper_new)
          elif helper_new not in body:
              raise SystemExit('promotion helper source drifted; refusing to continue')

          source_anchor_fixes = {
              '"Glaze UI 1.4.0 remains the immediately preceding historical Stable baseline."':
                  '"Glaze UI 1.4.0 is the immediately preceding historical Stable baseline."',
              '"While 1.5.x remains Stable"': '"While 1.5.x is Stable"',
              '"No Glaze UI 1.6 Candidate capability changes the current 1.5.0 Stable consumer target until separately promoted."':
                  '"The 1.6 evidence-presentation Candidate is defined by `EVIDENCE_PRESENTATION.md`, `tokens/evidence-presentation.json`, and `tokens/mesh-evidence-profile.json`. The 1.6 Adaptive Workspace Candidate is defined by `WORKSPACE_NAVIGATION.md`, `tokens/workspace-navigation.candidate.json`, `css/glaze.workspace.candidate.css`, `reference/candidate-1.6-workspace.html`, and `scripts/validate_workspace_navigation.py`. Both are implemented source material under formal promotion review and are **not** part of the 1.5.0 Stable compatibility promise or current Stable consumer target."',
              '"Glaze Motion is not part of the Glaze UI 1.5.0 Stable compatibility promise"':
                  '"Motion Core 0.2 is implemented development source but is **not** part of Glaze UI 1.5.0 Stable"',
          }
          for old, new in source_anchor_fixes.items():
              if old in body:
                  body = body.replace(old, new)

          obsolete_call = '''replace("STABILITY.md", "The 1.5 Stable baseline promotes adaptive color, iconography/construction/identity, motion/interaction, material/depth, layout/spacing/density, and semantic interaction-state/input-modality contracts on top of retained 1.4 form-factor semantics.",\n        "The 1.6 Stable baseline retains the complete 1.5 adaptive-color, iconography, motion, material, layout, state, and form-factor foundation and promotes evidence presentation/authority surfaces plus Adaptive Workspace/Navigation.")'''
          optional_call = obsolete_call[:-1] + ', required=False)'
          if obsolete_call in body:
              body = body.replace(obsolete_call, optional_call)

          optional_calls = {
              'replace("STABILITY.md", "the current Stable 1.5.0 release", "the current Stable 1.6.0 release")':
                  'replace("STABILITY.md", "the current Stable 1.5.0 release", "the current Stable 1.6.0 release", required=False)',
              'replace("COMPONENT_STATUS.md", "# Glaze UI Component Lifecycle Registry", "# Glaze UI Component Lifecycle Registry")':
                  'replace("COMPONENT_STATUS.md", "# Glaze UI Component Lifecycle Registry", "# Glaze UI Component Lifecycle Registry", required=False)',
          }
          for old, new in optional_calls.items():
              if old in body:
                  body = body.replace(old, new)

          path.write_text(body, encoding='utf-8')
          PY
      - name: Apply deterministic 1.6 Stable conversion
        run: python3 scripts/promote_1_6_stable.py
      - name: Keep CI workflow edits out of release automation push
        run: git checkout -- .github/workflows/ci.yml
      - name: Commit release-state conversion
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Promote Glaze UI 1.6.0 to Stable [promotion-bot]"
          git push origin HEAD:agent/glaze-ui-1.6-stable-promotion
