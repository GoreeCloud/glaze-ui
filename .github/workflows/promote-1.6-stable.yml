name: Promote Glaze UI 1.6 Stable branch

on:
  push:
    branches:
      - agent/glaze-ui-1.6-stable-promotion

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[promotion-bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-ui-1.6-stable-promotion
          persist-credentials: true
      - name: Make promotion converter rerun-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/promote_1_6_stable.py')
          body = path.read_text(encoding='utf-8')
          old = '''    if old not in body:\n        if required:\n            raise SystemExit(f"promotion replacement missing in {path}: {old!r}")\n        return\n    write(path, body.replace(old, new))\n'''
          new = '''    if old not in body:\n        if new in body:\n            return\n        if required:\n            raise SystemExit(f"promotion replacement missing in {path}: {old!r}")\n        return\n    write(path, body.replace(old, new))\n'''
          if old in body:
              path.write_text(body.replace(old, new), encoding='utf-8')
          elif new not in body:
              raise SystemExit('promotion helper source drifted; refusing to continue')
          PY
      - name: Apply deterministic 1.6 Stable conversion
        run: python3 scripts/promote_1_6_stable.py
      - name: Commit release-state conversion
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Promote Glaze UI 1.6.0 to Stable [promotion-bot]"
          git push origin HEAD:agent/glaze-ui-1.6-stable-promotion
