name: Verify August 24 Fold identity production

on:
  pull_request:
    paths:
      - ".github/workflows/verify-production-fold-identity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out exact verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify Design production Fold publication bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, build_opener
          import hashlib
          import time

          checks = {
              "homepage": (Path("website/index.html"), "https://design.goreecloud.com/"),
              "identity-css": (Path("website/identity.css"), "https://design.goreecloud.com/assets/identity.css"),
              "fold-mark": (Path("assets/identity/official/fold/glaze-ui-mark.svg"), "https://design.goreecloud.com/assets/glaze-ui-mark.svg"),
              "fold-lockup": (Path("assets/identity/official/fold/glaze-ui-lockup.svg"), "https://design.goreecloud.com/assets/glaze-ui-lockup.svg"),
          }
          opener = build_opener()

          def fetch(url):
              request = Request(url, headers={"User-Agent":"GoreeCloud-Fold-Aug24-Production-Verifier/1.0","Accept-Encoding":"identity"})
              try:
                  with opener.open(request, timeout=15) as response:
                      host = response.geturl().split("/", 3)[2]
                      return host, response.status, response.read()
              except HTTPError as exc:
                  return url.split("/", 3)[2], exc.code, exc.read()
              except URLError as exc:
                  raise RuntimeError(f"request failed for {url}: {exc.reason}") from exc

          for attempt in range(1, 7):
              failures = []
              for name, (source, url) in checks.items():
                  expected = source.read_bytes()
                  host, status, body = fetch(url)
                  if host != "design.goreecloud.com" or status != 200 or body != expected:
                      failures.append((name, status, host, hashlib.sha256(expected).hexdigest(), hashlib.sha256(body).hexdigest()))
              if not failures:
                  print("Design production homepage and canonical Fold identity assets are source-identical.")
                  break
              if attempt == 6:
                  for name, status, host, expected_sha, actual_sha in failures:
                      print(f"{name}: status={status} host={host} expected={expected_sha} actual={actual_sha}")
                  raise SystemExit("Design Fold production verification failed")
              print(f"Design production is not yet Fold-identical (attempt {attempt}/6); retrying in 10 seconds.")
              time.sleep(10)
          PY
