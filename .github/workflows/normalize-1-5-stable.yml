name: One-shot Glaze UI 1.5 Stable lifecycle normalization

on:
  push:
    branches:
      - agent/glaze-motion-interaction-2026-08-25

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-motion-interaction-2026-08-25
          fetch-depth: 0
      - name: Normalize active Stable contracts
        run: python3 scripts/normalize_1_5_stable.py
      - name: Commit normalized contracts only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/normalize_1_5_stable.py .github/workflows/normalize-1-5-stable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'normalization produced no changes'; exit 1; }
          git commit -m 'Normalize Glaze UI 1.5 Stable contract lifecycle wording'
          git push origin HEAD:agent/glaze-motion-interaction-2026-08-25
