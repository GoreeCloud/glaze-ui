name: Glaze UI V1.6 Performance Qualification Control

on:
  pull_request:
    paths:
      - 'contracts/v1.6/qualification.performance.plan.json'
      - 'schemas/v1.6-performance-qualification-plan.schema.json'
      - 'reference/v1.6/performance-qualification.html'
      - 'scripts/prepare_glaze_v1_6_performance_qualification.py'
      - 'scripts/validate_glaze_v1_6_performance_qualification_plan.mjs'
      - 'acceptance/v1.6-development.md'
      - 'README.md'
      - 'FEATURE-ROADMAP.md'
      - '.github/workflows/glaze-v1.6-performance-qualification-control.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-6-performance-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V16_SOURCE_SHA: c7509c79256b04b0aa67cb9dd0737d7588e0ae4a

jobs:
  verify-performance-qualification-control:
    name: Verify V1.6 performance qualification control
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision and frozen source availability
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V16_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V16_SOURCE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Syntax-check qualification tooling
        run: |
          node --check scripts/validate_glaze_v1_6_performance_qualification_plan.mjs
          python -m py_compile scripts/prepare_glaze_v1_6_performance_qualification.py

      - name: Validate performance qualification control and fail-closed behavior
        run: node scripts/validate_glaze_v1_6_performance_qualification_plan.mjs

      - name: Prepare exact-source review root as a structural smoke test
        run: |
          python scripts/prepare_glaze_v1_6_performance_qualification.py --out _v16-performance-control-smoke
          test -f _v16-performance-control-smoke/qualification-source.json
          test -f _v16-performance-control-smoke/js/glaze-v1.6-development.mjs
          test -f _v16-performance-control-smoke/reference/v1.6/performance-qualification.html
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_v16-performance-control-smoke/qualification-source.json').read_text())
          assert data['sourceRevision']=='c7509c79256b04b0aa67cb9dd0737d7588e0ae4a'
          assert data['acceptanceModelVersion']=='1.6.0-dev.12'
          assert data['stableBaseline']=='1.5.1'
          assert data['performanceEvidenceClaimed'] is False
          assert data['representativeEnvironmentClaimed'] is False
          print('Exact-source review-root preparation smoke test: PASS')
          PY

      - name: Preserve V1.6 performance diagnostics behavior
        run: node scripts/validate_glaze_v1_6_performance_diagnostics_development.mjs

      - name: Preserve V1.6 acceptance-control behavior
        run: node scripts/validate_glaze_v1_6_acceptance_development.mjs

      - name: Preserve V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
