name: One-time GLAZE UI V1 normalization

on:
  push:
    branches:
      - glaze-ui-v1-reset

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glaze-ui-v1-reset
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize inherited implementation namespaces
        run: python scripts/normalize_glaze_v1_reset.py
      - name: Validate normalized V1 tree
        run: python scripts/validate_glaze_v1.py
      - name: Remove one-time reset automation
        run: |
          rm -f .github/workflows/glaze-v1-normalize.yml
          rm -f scripts/normalize_glaze_v1_reset.py
      - name: Commit normalized reset tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git commit -m "Normalize inherited Glaze UI implementation to V1"
          git push origin HEAD:glaze-ui-v1-reset
