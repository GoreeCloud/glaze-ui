name: Glaze UI V1.6 Remaining Qualification Session

on:
  pull_request:
    paths:
      - 'scripts/prepare_glaze_v1_6_remaining_qualification.py'
      - 'contracts/v1.6/acceptance.dev.json'
      - 'contracts/v1.6/qualification.human.plan.json'
      - 'contracts/v1.6/qualification.assistive-technology.plan.json'
      - 'contracts/v1.6/qualification.performance.plan.json'
      - 'contracts/v1.6/qualification-evidence-intake.json'
      - 'acceptance/v1.6-human-evidence.template.json'
      - 'acceptance/v1.6-assistive-technology-evidence.template.json'
      - 'acceptance/v1.6-performance-evidence.template.json'
      - 'README.md'
      - 'acceptance/v1.6-development.md'
      - 'FEATURE-ROADMAP.md'
      - '.github/workflows/glaze-v1.6-remaining-qualification-session.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-6-remaining-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V16_SOURCE_SHA: c7509c79256b04b0aa67cb9dd0737d7588e0ae4a

jobs:
  verify-remaining-qualification-session:
    name: Verify V1.6 remaining qualification session
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision and frozen source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V16_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V16_SOURCE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Syntax-check remaining qualification coordinator
        run: python -m py_compile scripts/prepare_glaze_v1_6_remaining_qualification.py

      - name: Self-test coordinated exact-source bundle
        run: python scripts/prepare_glaze_v1_6_remaining_qualification.py --self-test

      - name: Prepare one structural smoke-test bundle
        run: |
          set -euo pipefail
          python scripts/prepare_glaze_v1_6_remaining_qualification.py --out _v16-remaining-qualification-smoke
          test -f _v16-remaining-qualification-smoke/qualification-session.json
          test -f _v16-remaining-qualification-smoke/human/reference/v1.6/human-qualification.html
          test -f _v16-remaining-qualification-smoke/assistive-technology/reference/v1.6/assistive-technology-qualification.html
          test -f _v16-remaining-qualification-smoke/performance/reference/v1.6/performance-qualification.html
          test -f _v16-remaining-qualification-smoke/records/v1.6-human-evidence.template.json
          test -f _v16-remaining-qualification-smoke/records/v1.6-assistive-technology-evidence.template.json
          test -f _v16-remaining-qualification-smoke/records/v1.6-performance-evidence.template.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_v16-remaining-qualification-smoke/qualification-session.json')
          data=json.loads(p.read_text())
          assert data['sourceRevision']=='c7509c79256b04b0aa67cb9dd0737d7588e0ae4a'
          assert data['acceptanceModelVersion']=='1.6.0-dev.12'
          assert data['stableBaseline']=='1.5.1'
          assert data['currentDisposition']['verifiedCount']==17
          assert data['currentDisposition']['unverifiedCount']==7
          assert data['currentDisposition']['notApplicableCount']==0
          assert data['currentDisposition']['blockingLaneIds']==[
              'accessibility','keyboard-navigation','assistive-technology','performance',
              'privacy-boundaries','authority-boundaries','representative-rendering'
          ]
          assert [x['id'] for x in data['sessions']]==['human','assistive-technology','performance']
          assert data['authority']['bundleIsEvidence'] is False
          assert data['authority']['stableStatusGranted'] is False
          print('Coordinated V1.6 remaining-qualification bundle smoke test: PASS')
          PY
          rm -rf _v16-remaining-qualification-smoke

      - name: Preserve human review control
        run: node scripts/validate_glaze_v1_6_human_qualification_plan.mjs

      - name: Preserve assistive technology review control
        run: node scripts/validate_glaze_v1_6_assistive_technology_qualification_plan.mjs

      - name: Preserve representative performance review control
        run: node scripts/validate_glaze_v1_6_performance_qualification_plan.mjs

      - name: Preserve external evidence record controls
        run: node scripts/validate_glaze_v1_6_external_evidence_records.mjs

      - name: Preserve current 17/7 reconciliation boundary
        run: |
          node scripts/evaluate_glaze_v1_6_qualification_evidence.mjs > /tmp/v16-reconciliation.json
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('/tmp/v16-reconciliation.json','utf8'));
          if(result.matrix.verifiedCount!==17||result.matrix.unverifiedCount!==7||result.matrix.notApplicableCount!==0){
            throw new Error('V1.6 qualification disposition drifted');
          }
          if(result.matrix.qualificationEvidenceComplete!==false||result.matrix.readyForGovernedQualificationReview!==false){
            throw new Error('V1.6 qualification must remain incomplete before real external evidence exists');
          }
          console.log('Current V1.6 reconciliation boundary preserved: 17 verified / 7 unverified / 0 N/A');
          NODE

      - name: Preserve V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .
