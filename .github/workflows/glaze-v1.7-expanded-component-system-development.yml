name: Glaze UI V1.7 Expanded Component System Development
on:
  pull_request:
    paths: ['GLAZE_UI_V1_7_PLANNED.md','contracts/v1.7/expanded-component-system.dev.json','schemas/v1.7-expanded-component-system.schema.json','tokens/glaze-v1.7-expanded-component-system.dev.json','js/glaze-v1.7-expanded-component-system.dev.mjs','js/glaze-v1.7-development.mjs','scripts/validate_glaze_v1_7_expanded_component_system_development.mjs','scripts/validate_glaze_v1_7_native_glaze_kits_development.mjs','.github/workflows/glaze-v1.7-expanded-component-system-development.yml','PLANNED-FEATURES.md','IMPLEMENTED-FEATURES.md','CHANGELOGS.md','VERSION','registry/lifecycle.json']
  push:
    branches: [main]
    paths: ['GLAZE_UI_V1_7_PLANNED.md','contracts/v1.7/expanded-component-system.dev.json','schemas/v1.7-expanded-component-system.schema.json','tokens/glaze-v1.7-expanded-component-system.dev.json','js/glaze-v1.7-expanded-component-system.dev.mjs','js/glaze-v1.7-development.mjs','scripts/validate_glaze_v1_7_expanded_component_system_development.mjs','scripts/validate_glaze_v1_7_native_glaze_kits_development.mjs','.github/workflows/glaze-v1.7-expanded-component-system-development.yml','PLANNED-FEATURES.md','IMPLEMENTED-FEATURES.md','CHANGELOGS.md','VERSION','registry/lifecycle.json']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: glaze-v1-7-expanded-components-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  expanded-component-development:
    name: Validate V1.7 Expanded Component System Development foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/v1.7/expanded-component-system.dev.json >/dev/null
          python -m json.tool schemas/v1.7-expanded-component-system.schema.json >/dev/null
          python -m json.tool tokens/glaze-v1.7-expanded-component-system.dev.json >/dev/null
      - name: Validate JavaScript syntax
        run: |
          node --check js/glaze-v1.7-expanded-component-system.dev.mjs
          node --check js/glaze-v1.7-development.mjs
          node --check scripts/validate_glaze_v1_7_expanded_component_system_development.mjs
          node --check scripts/validate_glaze_v1_7_native_glaze_kits_development.mjs
      - name: Validate V1.7 Expanded Component System Development foundation
        run: node scripts/validate_glaze_v1_7_expanded_component_system_development.mjs
  v1-7-regression:
    name: Preserve V1.7 dev.1-dev.9 foundations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Verify prior V1.7 Development foundations
        run: |
          node scripts/validate_glaze_v1_7_task_continuity_development.mjs
          node scripts/validate_glaze_v1_7_adaptive_input_development.mjs
          node scripts/validate_glaze_v1_7_form_factor_profiles_development.mjs
          node scripts/validate_glaze_v1_7_command_surface_development.mjs
          node scripts/validate_glaze_v1_7_personalization_development.mjs
          node scripts/validate_glaze_v1_7_system_shell_continuity_development.mjs
          node scripts/validate_glaze_v1_7_notification_activity_surfaces_development.mjs
          node scripts/validate_glaze_v1_7_theme_semantic_color_development.mjs
          node scripts/validate_glaze_v1_7_native_glaze_kits_development.mjs
  v1-6-stable-authority:
    name: Preserve GLAZE UI V1.6 Stable authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/verify_glaze_v1_6_stable_qualification_review.mjs
      - run: node scripts/verify_glaze_v1_6_stable.mjs
  v1-5-1-rollback-integrity:
    name: Preserve V1.5.1 rollback Stable integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - run: node scripts/verify_glaze_v1_5_1_stable.mjs
