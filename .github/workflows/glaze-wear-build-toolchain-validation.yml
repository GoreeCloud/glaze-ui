name: Glaze UI Wear OS Build Toolchain Validation

on:
  pull_request:
    paths:
      - 'reference/native/wear-os/buildable/**'
      - '.github/workflows/glaze-wear-build-toolchain-validation.yml'
      - '.github/workflows/wear-os-emulator.yml'
  push:
    branches: [main]
    paths:
      - 'reference/native/wear-os/buildable/**'
      - '.github/workflows/glaze-wear-build-toolchain-validation.yml'
      - '.github/workflows/wear-os-emulator.yml'

permissions:
  contents: read

concurrency:
  group: glaze-wear-build-toolchain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Install verified Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
            --output /tmp/gradle-9.6.0-bin.zip
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  /tmp/gradle-9.6.0-bin.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle-9.6.0-bin.zip -d /tmp
          echo "/tmp/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Build Wear OS reference APK
        working-directory: reference/native/wear-os/buildable
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s reference/native/wear-os/buildable/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify build did not mutate tracked source
        run: git diff --exit-code -- .
