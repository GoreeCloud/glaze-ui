name: GLAZE UI V1.3 Historical Stable Authority

on:
  push:
    branches:
      - main
    paths:
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - registry/lifecycle.json
      - acceptance/v1.3-stable.md
      - acceptance/v1.3-deferred-qualification.md
      - releases/1.3.0.md
      - css/glaze-v1.3.0.css
      - js/glaze-v1.3.0.mjs
      - .github/workflows/glaze-v1.3-stable-authority.yml
  pull_request:
    paths:
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - registry/lifecycle.json
      - acceptance/v1.3-stable.md
      - acceptance/v1.3-deferred-qualification.md
      - releases/1.3.0.md
      - css/glaze-v1.3.0.css
      - js/glaze-v1.3.0.mjs
      - .github/workflows/glaze-v1.3-stable-authority.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  historical-stable-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify V1.3 remains a historical Stable rollback target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle = json.loads(Path('registry/lifecycle.json').read_text())
          releases = {r['version']: r for r in lifecycle['releases']}
          v13 = releases.get('1.3.0')
          assert v13, 'missing V1.3 release record'
          assert v13['status'] == 'stable'
          assert v13['consumerEligible'] is True
          assert v13['webEntrypoint'] == 'css/glaze-v1.3.0.css'
          assert v13['runtimeEntrypoint'] == 'js/glaze-v1.3.0.mjs'
          print('GLAZE UI V1.3 historical Stable authority: PASS')
          PY

      - name: Parse lifecycle JSON
        run: python -m json.tool registry/lifecycle.json >/dev/null

      - name: Check V1.3 runtime syntax and graph
        run: |
          node --check js/glaze-v1.3.0.mjs
          node -e "import('./js/glaze-v1.3.0.mjs').then(() => console.log('GLAZE UI V1.3 historical runtime graph: PASS'))"

      - name: Verify V1.3 Stable wrappers remain intact
        run: |
          grep -F 'official Stable web entrypoint' css/glaze-v1.3.0.css
          grep -F '@import url("./glaze-v1.2.0.css");' css/glaze-v1.3.0.css

      - name: Report historical boundary
        run: |
          echo 'GLAZE UI V1.3 / 1.3.0 remains a supported historical Stable rollback target.'
          echo 'Current lifecycle authority is determined by VERSION and registry/lifecycle.json; this workflow no longer requires V1.3 to be the current version.'
