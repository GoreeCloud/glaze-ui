name: GLAZE UI V1.3 Historical Stable Integrity

on:
  push:
    branches: [main]
    paths:
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - registry/lifecycle.json
      - acceptance/v1.3-stable.md
      - acceptance/v1.3-deferred-qualification.md
      - css/glaze-v1.3.0.css
      - js/glaze-v1.3.0.mjs
      - scripts/validate_glaze_v1_3_phase0.py
      - scripts/validate_glaze_v1_3_stable_readiness.py
      - .github/workflows/glaze-v1.3-stable-authority.yml
  pull_request:
    paths:
      - GLAZE_UI_V1_3.md
      - GLAZE_UI_V1_3_1_HARDENING.md
      - registry/lifecycle.json
      - acceptance/v1.3-stable.md
      - acceptance/v1.3-deferred-qualification.md
      - css/glaze-v1.3.0.css
      - js/glaze-v1.3.0.mjs
      - scripts/validate_glaze_v1_3_phase0.py
      - scripts/validate_glaze_v1_3_stable_readiness.py
      - .github/workflows/glaze-v1.3-stable-authority.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  historical-stable-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate preserved V1.3 Stable release boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Validate V1.3 Stable/readiness provenance
        run: python scripts/validate_glaze_v1_3_stable_readiness.py
      - name: Parse lifecycle authority
        run: python -m json.tool registry/lifecycle.json >/dev/null
      - name: Check V1.3 Stable runtime syntax
        run: node --check js/glaze-v1.3.0.mjs
      - name: Verify V1.3 browser runtime module graph statically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd().resolve()
          entry = (root / 'js/glaze-v1.3.0.mjs').resolve()
          pattern = re.compile(
              r'''(?:import\s*\(|(?:import|export)\s+(?:[^"']*?\s+from\s+)?)['"](\./[^'"]+)['"]'''
          )
          pending = [entry]
          seen = set()

          while pending:
              module = pending.pop()
              if module in seen:
                  continue
              if root not in module.parents:
                  raise SystemExit(f'module escaped repository root: {module}')
              if not module.is_file():
                  raise SystemExit(f'missing runtime module: {module.relative_to(root)}')
              seen.add(module)
              subprocess.run(['node', '--check', str(module)], check=True)
              text = module.read_text(encoding='utf-8')
              for specifier in pattern.findall(text):
                  target = (module.parent / specifier).resolve()
                  if target.suffix == '':
                      target = target.with_suffix('.mjs')
                  if target.suffix == '.mjs':
                      pending.append(target)

          print(f'GLAZE UI V1.3 historical browser runtime graph: PASS ({len(seen)} modules syntax-checked; no DOM execution attempted)')
          PY
      - name: Verify V1.3 Stable CSS source boundary
        run: |
          grep -F 'official Stable web entrypoint' css/glaze-v1.3.0.css
          grep -F '@import url("./glaze-v1.2.0.css");' css/glaze-v1.3.0.css
      - name: Verify historical release authority markers
        run: |
          grep -F '**Lifecycle:** Official Stable' GLAZE_UI_V1_3.md
          grep -F '**Status:** Official Stable release' acceptance/v1.3-stable.md
          grep -F 'V1.3.1' acceptance/v1.3-deferred-qualification.md
      - name: Report historical boundary
        run: |
          echo 'GLAZE UI V1.3 / 1.3.0 remains preserved as a historical Stable rollback baseline.'
          echo 'This workflow does not assert that V1.3 is the current Stable release.'
