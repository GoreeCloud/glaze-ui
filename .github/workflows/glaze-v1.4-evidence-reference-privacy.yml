name: Glaze V1.4 Evidence Reference Privacy

on:
  pull_request:
    paths:
      - 'contracts/v1.4/performance-qualification-evidence.schema.candidate.json'
      - 'contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json'
      - 'contracts/v1.4/accessibility-qualification-evidence.schema.candidate.json'
      - 'scripts/evaluate_glaze_v1_4_performance_qualification.py'
      - 'scripts/evaluate_glaze_v1_4_native_renderer_parity.py'
      - 'scripts/evaluate_glaze_v1_4_accessibility_qualification.py'
      - 'scripts/validate_glaze_v1_4_performance_qualification.py'
      - 'scripts/validate_glaze_v1_4_accessibility_qualification.py'
      - 'scripts/validate_glaze_v1_4_evidence_reference_privacy.py'
      - 'docs/GLAZE_UI_V1_4_EVIDENCE_REFERENCE_PRIVACY.md'
      - '.github/workflows/glaze-v1.4-evidence-reference-privacy.yml'
  push:
    branches:
      - 'upgrade/glaze-ui-v1.4-*'
      - main
    paths:
      - 'contracts/v1.4/performance-qualification-evidence.schema.candidate.json'
      - 'contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json'
      - 'contracts/v1.4/accessibility-qualification-evidence.schema.candidate.json'
      - 'scripts/evaluate_glaze_v1_4_performance_qualification.py'
      - 'scripts/evaluate_glaze_v1_4_native_renderer_parity.py'
      - 'scripts/evaluate_glaze_v1_4_accessibility_qualification.py'
      - 'scripts/validate_glaze_v1_4_performance_qualification.py'
      - 'scripts/validate_glaze_v1_4_accessibility_qualification.py'
      - 'scripts/validate_glaze_v1_4_evidence_reference_privacy.py'
      - 'docs/GLAZE_UI_V1_4_EVIDENCE_REFERENCE_PRIVACY.md'
      - '.github/workflows/glaze-v1.4-evidence-reference-privacy.yml'

permissions:
  contents: read

jobs:
  evidence-reference-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact V1.4 candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate cross-plane evidence reference privacy
        run: python scripts/validate_glaze_v1_4_evidence_reference_privacy.py

      - name: Parse governed evidence schemas
        run: |
          python -m json.tool contracts/v1.4/performance-qualification-evidence.schema.candidate.json >/dev/null
          python -m json.tool contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json >/dev/null
          python -m json.tool contracts/v1.4/accessibility-qualification-evidence.schema.candidate.json >/dev/null

      - name: Compile evidence evaluators and privacy validator
        run: |
          python -m py_compile scripts/evaluate_glaze_v1_4_performance_qualification.py
          python -m py_compile scripts/evaluate_glaze_v1_4_native_renderer_parity.py
          python -m py_compile scripts/evaluate_glaze_v1_4_accessibility_qualification.py
          python -m py_compile scripts/validate_glaze_v1_4_evidence_reference_privacy.py

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code
