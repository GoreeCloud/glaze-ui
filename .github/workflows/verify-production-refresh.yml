name: Verify refreshed Design production content

on:
  pull_request:
    paths:
      - ".github/workflows/verify-production-refresh.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact verification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Design production homepage bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, time
          expected = Path('website/index.html').read_bytes()
          url = 'https://design.goreecloud.com/'
          for attempt in range(1, 7):
              req = Request(url, headers={'User-Agent':'GoreeCloud-Design-Production-Verifier/1.0','Accept-Encoding':'identity'})
              with urlopen(req, timeout=15) as response:
                  host = response.geturl().split('/', 3)[2]
                  body = response.read()
                  status = response.status
              if host == 'design.goreecloud.com' and status == 200 and body == expected:
                  print('Design production homepage matches exact merged source bytes.')
                  break
              if attempt == 6:
                  print(f'status={status} host={host} expected={hashlib.sha256(expected).hexdigest()} actual={hashlib.sha256(body).hexdigest()}')
                  raise SystemExit('Design production verification failed')
              time.sleep(10)
          PY
