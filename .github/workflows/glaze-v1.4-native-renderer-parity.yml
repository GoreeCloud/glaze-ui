name: Glaze V1.4 Native Renderer Parity Candidate

on:
  pull_request:
    paths:
      - 'contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json'
      - 'evidence/v1.4/templates/native-renderer-parity-record.candidate.json'
      - 'scripts/evaluate_glaze_v1_4_native_renderer_parity.py'
      - 'tests/test_glaze_v1_4_native_renderer_parity.py'
      - 'docs/GLAZE_UI_V1_4_NATIVE_RENDERER_PARITY.md'
      - '.github/workflows/glaze-v1.4-native-renderer-parity.yml'
  push:
    branches:
      - 'upgrade/glaze-ui-v1.4-*'
      - main
    paths:
      - 'contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json'
      - 'evidence/v1.4/templates/native-renderer-parity-record.candidate.json'
      - 'scripts/evaluate_glaze_v1_4_native_renderer_parity.py'
      - 'tests/test_glaze_v1_4_native_renderer_parity.py'
      - 'docs/GLAZE_UI_V1_4_NATIVE_RENDERER_PARITY.md'
      - '.github/workflows/glaze-v1.4-native-renderer-parity.yml'

permissions:
  contents: read

jobs:
  native-renderer-parity-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact V1.4 candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Parse native renderer parity evidence schema and template
        run: |
          python -m json.tool contracts/v1.4/native-renderer-parity-evidence.schema.candidate.json >/dev/null
          python -m json.tool evidence/v1.4/templates/native-renderer-parity-record.candidate.json >/dev/null

      - name: Run native renderer parity qualification regressions
        run: python tests/test_glaze_v1_4_native_renderer_parity.py

      - name: Verify template remains blocked and non-promoting
        run: |
          python scripts/evaluate_glaze_v1_4_native_renderer_parity.py \
            evidence/v1.4/templates/native-renderer-parity-record.candidate.json \
            > /tmp/glaze-v1.4-native-parity-template-evaluation.json
          python - <<'PY'
          import json
          with open('/tmp/glaze-v1.4-native-parity-template-evaluation.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['evaluatorDisposition'] == 'blocked'
          assert result['acceptedForNativeRendererParityQualification'] is False
          assert result['acceptedForLifecycleGate'] is False
          PY

      - name: Compile evaluator and tests
        run: |
          python -m py_compile scripts/evaluate_glaze_v1_4_native_renderer_parity.py
          python -m py_compile tests/test_glaze_v1_4_native_renderer_parity.py

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code
