name: GLAZE UI V1.4.1 Promotion Evidence Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  promotion-evidence:
    if: ${{ github.event.pull_request.body && contains(github.event.pull_request.body, '<!-- glaze-v1.4.1-promotion-gate -->') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact promotion revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve governed evidence source
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          TARGET_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const releaseMarker = '<!-- glaze-v1.4.1-release-continuity:pr-224@66478aed461b83c49b2ed027c3e4afc26520e98c -->';
          const body = process.env.PR_BODY || '';
          let sourcePr = process.env.CURRENT_PR;
          let sourceAnchor = process.env.TARGET_REVISION;
          let evidenceMode = 'direct-exact-head';
          if (body.includes(releaseMarker)) {
            sourcePr = '224';
            sourceAnchor = '66478aed461b83c49b2ed027c3e4afc26520e98c';
            evidenceMode = 'governed-release-continuity';
          }
          const lines = [
            `EVIDENCE_SOURCE_PR=${sourcePr}`,
            `EVIDENCE_SOURCE_ANCHOR=${sourceAnchor}`,
            `EVIDENCE_MODE=${evidenceMode}`
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);
          console.log(`Evidence mode: ${evidenceMode}`);
          console.log(`Evidence source PR: #${sourcePr}`);
          console.log(`Evidence source anchor: ${sourceAnchor}`);
          NODE

      - name: Verify promotion protocol before loading human evidence
        run: |
          node --check scripts/verify_glaze_v1_4_1_human_validation.mjs
          node --check scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
          node --check scripts/prepare_glaze_v1_4_1_release_continuity.mjs
          node scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
          node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
          node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
          node scripts/verify_glaze_v1_4_stable.mjs

      - name: Retrieve durable promotion evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/issues/${EVIDENCE_SOURCE_PR}/comments?per_page=100" \
            > "${RUNNER_TEMP}/v1.4.1-promotion-comments.json"

      - name: Extract exactly one governed evidence record
        env:
          EVIDENCE_MARKER: GLAZE-V1.4.1-PROMOTION-EVIDENCE-V3-GZIP-BASE64
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const commentsPath = path.join(process.env.RUNNER_TEMP, 'v1.4.1-promotion-comments.json');
          const recordPath = path.join(process.env.RUNNER_TEMP, 'v1.4.1-source-human-evidence.json');
          const comments = JSON.parse(fs.readFileSync(commentsPath, 'utf8'));
          const marker = process.env.EVIDENCE_MARKER;
          const matches = comments.filter(comment =>
            typeof comment?.body === 'string' && comment.body.startsWith(`${marker}\n`)
          );
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one ${marker} comment on governed source PR; found ${matches.length}.`);
          }
          const remainder = matches[0].body.slice(marker.length).trim();
          const fenced = remainder.match(/^```text\s*\n([A-Za-z0-9+/=\r\n]+)\n```$/);
          if (!fenced) {
            throw new Error('Promotion evidence comment must contain exactly one fenced base64 payload after the marker.');
          }
          const compressed = Buffer.from(fenced[1].replace(/\s+/g, ''), 'base64');
          const jsonText = zlib.gunzipSync(compressed).toString('utf8');
          const record = JSON.parse(jsonText);
          fs.writeFileSync(recordPath, `${JSON.stringify(record, null, 2)}\n`, {flag: 'wx'});
          const digest = crypto.createHash('sha256').update(jsonText).digest('hex');
          console.log(`Loaded governed promotion evidence from ${matches[0].html_url}`);
          console.log(`Uncompressed evidence sha256:${digest}`);
          NODE

      - name: Verify governed source promotion record
        run: |
          node scripts/verify_glaze_v1_4_1_human_validation.mjs \
            --record "${RUNNER_TEMP}/v1.4.1-source-human-evidence.json" \
            --promotion \
            --expected-revision "${EVIDENCE_SOURCE_ANCHOR}"

      - name: Prepare exact release-head continuity when required
        run: |
          if [ "${EVIDENCE_SOURCE_ANCHOR}" = "${{ github.event.pull_request.head.sha }}" ]; then
            cp "${RUNNER_TEMP}/v1.4.1-source-human-evidence.json" "${RUNNER_TEMP}/v1.4.1-target-human-evidence.json"
          else
            node scripts/prepare_glaze_v1_4_1_release_continuity.mjs \
              --record "${RUNNER_TEMP}/v1.4.1-source-human-evidence.json" \
              --source-anchor "${EVIDENCE_SOURCE_ANCHOR}" \
              --target-revision "${{ github.event.pull_request.head.sha }}" \
              --output "${RUNNER_TEMP}/v1.4.1-target-human-evidence.json"
          fi

      - name: Run canonical fail-closed V1.4.1 promotion gate
        run: |
          node scripts/verify_glaze_v1_4_1_human_validation.mjs \
            --record "${RUNNER_TEMP}/v1.4.1-target-human-evidence.json" \
            --promotion \
            --expected-revision "${{ github.event.pull_request.head.sha }}"

      - name: Record verified gate result
        run: |
          {
            echo '### GLAZE UI V1.4.1 promotion evidence gate'
            echo
            echo '- Canonical human-validation promotion verifier: **PASS**'
            echo '- Exact promotion revision: `${{ github.event.pull_request.head.sha }}`'
            echo "- Governed evidence source PR: #${EVIDENCE_SOURCE_PR}"
            echo "- Governed evidence source anchor: \`${EVIDENCE_SOURCE_ANCHOR}\`"
            echo "- Evidence mode: \`${EVIDENCE_MODE}\`"
            echo '- V1.4.0 Stable-preservation verifier: **PASS**'
            echo '- Human evidence remains bound to its actual reviewed revisions; generated release continuity is source-impact governance evidence only.'
            echo
            echo 'This gate establishes evidence eligibility for this exact source revision only. Merge, release creation, and Stable lifecycle promotion remain separate governed transitions.'
          } >> "${GITHUB_STEP_SUMMARY}"
