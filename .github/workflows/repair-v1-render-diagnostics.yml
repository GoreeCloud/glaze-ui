name: Repair GLAZE UI V1 render diagnostics

on:
  push:
    branches:
      - 'fix/v1.1-import-closure-20260904'
    paths:
      - '.github/workflows/repair-v1-render-diagnostics.yml'

permissions:
  contents: write

jobs:
  repair-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact maintenance revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve nondeterministic capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('scripts/validate_glaze_v1_1_rendered.py')
          text = renderer.read_text(encoding='utf-8')
          old = '''    first_hash = hashlib.sha256(first).hexdigest()\n    second_hash = hashlib.sha256(second).hexdigest()\n    require(\n        first == second,\n        f"Screenshot capture is nondeterministic for {name}: first={first_hash}, second={second_hash}",\n    )\n    ARTIFACTS.mkdir(exist_ok=True)\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(second)\n    return path\n'''
          new = '''    first_hash = hashlib.sha256(first).hexdigest()\n    second_hash = hashlib.sha256(second).hexdigest()\n    ARTIFACTS.mkdir(exist_ok=True)\n    if first != second:\n        first_path = ARTIFACTS / f"glaze-v1.1-{name}-capture-a.png"\n        second_path = ARTIFACTS / f"glaze-v1.1-{name}-capture-b.png"\n        first_path.write_bytes(first)\n        second_path.write_bytes(second)\n        raise RenderedAcceptanceError(\n            f"Screenshot capture is nondeterministic for {name}: first={first_hash}, second={second_hash}; "\n            f"diagnostics={first_path.name},{second_path.name}"\n        )\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(second)\n    return path\n'''
          if old not in text:
              raise SystemExit('expected renderer repeatability block not found')
          renderer.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/glaze-v1.1-release-evidence.yml')
          text = workflow.read_text(encoding='utf-8')
          anchor = '''      - name: Upload V1.1 source-pinned web evidence\n        if: success()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4\n        with:\n          name: glaze-v1.1-web-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}\n          path: artifacts/glaze-v1.1-*.png\n          if-no-files-found: error\n          retention-days: 30\n\n'''
          replacement = anchor + '''      - name: Upload V1.1 web regression diagnostics\n        if: failure()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4\n        with:\n          name: glaze-v1.1-web-regression-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}\n          path: artifacts/glaze-v1.1-*.png\n          if-no-files-found: warn\n          retention-days: 7\n\n'''
          if anchor not in text:
              raise SystemExit('expected web evidence upload block not found')
          workflow.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Validate diagnostic changes
        run: |
          python3 -m py_compile scripts/validate_glaze_v1_1_rendered.py
          grep -F 'web-regression-diagnostics' .github/workflows/glaze-v1.1-release-evidence.yml
          grep -F 'capture-a.png' scripts/validate_glaze_v1_1_rendered.py

      - name: Commit diagnostics and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-v1-render-diagnostics.yml
          git diff --check
          git config user.name "GoreeCloud Release Maintenance"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add scripts/validate_glaze_v1_1_rendered.py .github/workflows/glaze-v1.1-release-evidence.yml .github/workflows/repair-v1-render-diagnostics.yml
          git diff --cached --quiet && { echo 'No diagnostic repair generated'; exit 1; }
          git commit -m "Preserve GLAZE UI visual regression diagnostics"
          CURRENT_REMOTE="$(git ls-remote origin refs/heads/fix/v1.1-import-closure-20260904 | cut -f1)"
          test "$CURRENT_REMOTE" = "$GITHUB_SHA"
          git push origin HEAD:fix/v1.1-import-closure-20260904
