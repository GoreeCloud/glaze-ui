name: Diagnose GLAZE UI V1 render nondeterminism

on:
  push:
    branches:
      - 'fix/v1.1-import-closure-20260904'
    paths:
      - '.github/workflows/repair-v1-render-diagnostics.yml'

permissions:
  contents: read

jobs:
  capture-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Add workspace-only mismatch capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('scripts/validate_glaze_v1_1_rendered.py')
          text = renderer.read_text(encoding='utf-8')
          old = '''    first_hash = hashlib.sha256(first).hexdigest()\n    second_hash = hashlib.sha256(second).hexdigest()\n    require(\n        first == second,\n        f"Screenshot capture is nondeterministic for {name}: first={first_hash}, second={second_hash}",\n    )\n    ARTIFACTS.mkdir(exist_ok=True)\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(second)\n    return path\n'''
          new = '''    first_hash = hashlib.sha256(first).hexdigest()\n    second_hash = hashlib.sha256(second).hexdigest()\n    ARTIFACTS.mkdir(exist_ok=True)\n    if first != second:\n        first_path = ARTIFACTS / f"glaze-v1.1-{name}-capture-a.png"\n        second_path = ARTIFACTS / f"glaze-v1.1-{name}-capture-b.png"\n        first_path.write_bytes(first)\n        second_path.write_bytes(second)\n        raise RenderedAcceptanceError(\n            f"Screenshot capture is nondeterministic for {name}: first={first_hash}, second={second_hash}; "\n            f"diagnostics={first_path.name},{second_path.name}"\n        )\n    path = ARTIFACTS / f"glaze-v1.1-{name}.png"\n    path.write_bytes(second)\n    return path\n'''
          if old not in text:
              raise SystemExit('expected renderer repeatability block not found')
          renderer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/validate_glaze_v1_1_rendered.py

      - name: Repeat exact renderer and preserve any mismatch pair
        shell: bash
        run: |
          set -uo pipefail
          rm -rf diagnostic-artifacts
          mkdir -p diagnostic-artifacts
          failures=0
          for i in 1 2 3 4 5; do
            rm -rf artifacts
            if python3 scripts/validate_glaze_v1_1_rendered.py; then
              mkdir -p "diagnostic-artifacts/run-$i-pass"
              cp artifacts/glaze-v1.1-*.png "diagnostic-artifacts/run-$i-pass/" 2>/dev/null || true
            else
              failures=$((failures + 1))
              mkdir -p "diagnostic-artifacts/run-$i-fail"
              cp artifacts/glaze-v1.1-*.png "diagnostic-artifacts/run-$i-fail/" 2>/dev/null || true
            fi
          done
          echo "diagnostic_failures=$failures" >> "$GITHUB_ENV"
          test -n "$(find diagnostic-artifacts -type f -name '*.png' -print -quit)"

      - name: Upload diagnostic captures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glaze-v1.1-render-diagnostics-${{ github.sha }}
          path: diagnostic-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Report diagnostic outcome
        run: echo "Diagnostic renderer mismatches observed in ${diagnostic_failures} of 5 repetitions."
