name: Glaze UI 2.2 Candidate Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - 'glaze-ui-2.2-*'

permissions:
  contents: read

jobs:
  validate-candidate-2-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile Glaze UI 2.2 validators
        run: |
          python3 -m py_compile scripts/validate_glaze_2_2_candidate.py
          python3 -m py_compile scripts/validate_glaze_2_2_components.py
          python3 -m py_compile scripts/validate_glaze_2_2_foundation_components.py
          python3 -m py_compile scripts/validate_glaze_2_2_foundation_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_structure_components.py
          python3 -m py_compile scripts/validate_glaze_2_2_structure_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_overlay_components.py
          python3 -m py_compile scripts/validate_glaze_2_2_overlay_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_system_shell_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_advanced_components.py
          python3 -m py_compile scripts/validate_glaze_2_2_advanced_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_system_interactions_rendered.py
          python3 -m py_compile scripts/validate_glaze_2_2_migration.py
          python3 -m py_compile scripts/validate_glaze_2_2_performance.py
          python3 -m py_compile scripts/validate_glaze_2_2_performance_rendered.py
          python3 -m py_compile scripts/validate_release_state.py

      - name: Check Glaze UI 2.2 web runtimes
        run: |
          node --check js/glaze-2.2.runtime.candidate.mjs
          node --check js/glaze-2.2.system-interactions.candidate.mjs

      - name: Test Glaze UI 2.2 runtime reducers
        run: |
          node --test tests/glaze-2.2-runtime.test.mjs
          node --test tests/glaze-2.2-system-interactions.test.mjs
          node --test tests/glaze-2.2-performance.test.mjs

      - name: Validate Glaze UI 2.2 Candidate source
        run: python3 scripts/validate_glaze_2_2_candidate.py

      - name: Validate Glaze UI 2.2 component contracts
        run: python3 scripts/validate_glaze_2_2_components.py

      - name: Validate Glaze UI 2.2 Foundation contracts
        run: python3 scripts/validate_glaze_2_2_foundation_components.py

      - name: Validate Glaze UI 2.2 Structure contracts
        run: python3 scripts/validate_glaze_2_2_structure_components.py

      - name: Validate Glaze UI 2.2 Overlay contracts
        run: python3 scripts/validate_glaze_2_2_overlay_components.py

      - name: Validate Glaze UI 2.2 advanced contracts
        run: python3 scripts/validate_glaze_2_2_advanced_components.py

      - name: Validate Glaze UI 2.2 migration evidence
        run: python3 scripts/validate_glaze_2_2_migration.py

      - name: Validate Glaze UI 2.2 performance evidence
        run: python3 scripts/validate_glaze_2_2_performance.py

      - name: Validate Glaze UI release state
        run: python3 scripts/validate_release_state.py

      - name: Run Glaze UI 2.2 System Shell rendered acceptance
        run: python3 scripts/validate_glaze_2_2_system_shell_rendered.py

      - name: Run Glaze UI 2.2 Foundation rendered acceptance
        run: python3 scripts/validate_glaze_2_2_foundation_rendered.py

      - name: Run Glaze UI 2.2 Structure rendered acceptance
        run: python3 scripts/validate_glaze_2_2_structure_rendered.py

      - name: Run Glaze UI 2.2 Overlay rendered acceptance
        run: python3 scripts/validate_glaze_2_2_overlay_rendered.py

      - name: Run Glaze UI 2.2 advanced rendered acceptance
        run: python3 scripts/validate_glaze_2_2_advanced_rendered.py

      - name: Run Glaze UI 2.2 system interaction rendered acceptance
        run: python3 scripts/validate_glaze_2_2_system_interactions_rendered.py

      - name: Run Glaze UI 2.2 performance rendered acceptance
        run: python3 scripts/validate_glaze_2_2_performance_rendered.py
