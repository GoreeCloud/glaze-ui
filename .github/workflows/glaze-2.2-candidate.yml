name: Glaze UI 2.2 Candidate Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - 'glaze-ui-2.2-*'

permissions:
  contents: read

jobs:
  validate-candidate-2-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compile Glaze UI 2.2 Candidate validators
        run: python3 -m py_compile scripts/validate_glaze_2_2_candidate.py scripts/validate_glaze_2_2_components.py scripts/validate_glaze_2_2_structure_components.py scripts/validate_glaze_2_2_components_rendered.py scripts/validate_glaze_2_2_rendered.py

      - name: Validate Glaze UI 2.2 Candidate runtime syntax
        run: node --check js/glaze-2.2.candidate.mjs

      - name: Test Glaze UI 2.2 Candidate runtime behavior
        run: node --test tests/glaze-2.2-runtime.test.mjs

      - name: Validate Glaze UI 2.2 Candidate foundation
        run: python3 scripts/validate_glaze_2_2_candidate.py

      - name: Validate Glaze UI 2.2 Foundation component contracts
        run: python3 scripts/validate_glaze_2_2_components.py

      - name: Validate Glaze UI 2.2 Structure component contracts
        run: python3 scripts/validate_glaze_2_2_structure_components.py

      - name: Validate canonical release-state consistency
        run: python3 scripts/validate_release_state.py

      - name: Validate retained Glaze UI repository contracts
        run: python3 scripts/validate_glaze_ui.py

      - name: Validate rendered Glaze UI 2.2 System Shell reference
        run: python3 scripts/validate_glaze_2_2_rendered.py

      - name: Validate rendered Glaze UI 2.2 Foundation components
        run: python3 scripts/validate_glaze_2_2_components_rendered.py
