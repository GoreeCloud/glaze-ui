name: Glaze UI 2.2 Candidate Foundation

on:
  pull_request:
  push:
    branches:
      - main
      - 'glaze-ui-2.2-*'

permissions:
  contents: read

jobs:
  validate-candidate-2-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out pinned Glaze UI 2.2 Candidate visual baseline source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 83bc9241590a47547d51369ea0812e40bb96775d
          path: .glaze-2.2-visual-baseline-source
          persist-credentials: false

      - name: Compile Glaze UI 2.2 Candidate validators
        run: python3 -m py_compile scripts/validate_glaze_2_2_candidate.py scripts/validate_glaze_2_2_components.py scripts/validate_glaze_2_2_structure_components.py scripts/validate_glaze_2_2_overlay_components.py scripts/validate_glaze_2_2_advanced_components.py scripts/validate_glaze_2_2_migration.py scripts/validate_glaze_2_2_performance.py scripts/validate_glaze_2_2_components_rendered.py scripts/validate_glaze_2_2_structure_rendered.py scripts/validate_glaze_2_2_overlay_rendered.py scripts/validate_glaze_2_2_advanced_rendered.py scripts/validate_glaze_2_2_system_interactions_rendered.py scripts/validate_glaze_2_2_performance_rendered.py scripts/validate_glaze_2_2_rendered.py scripts/glaze_2_2_visual_regression.py .glaze-2.2-visual-baseline-source/scripts/glaze_2_2_visual_regression.py

      - name: Validate Glaze UI 2.2 Candidate runtime syntax
        run: node --check js/glaze-2.2.candidate.mjs && node --check js/glaze-2.2.system-interactions.candidate.mjs

      - name: Test Glaze UI 2.2 Candidate runtime behavior
        run: node --test tests/glaze-2.2-runtime.test.mjs tests/glaze-2.2-system-interactions.test.mjs tests/glaze-2.2-performance.test.mjs

      - name: Validate Glaze UI 2.2 Candidate foundation
        run: python3 scripts/validate_glaze_2_2_candidate.py

      - name: Validate Glaze UI 2.2 Foundation component contracts
        run: python3 scripts/validate_glaze_2_2_components.py

      - name: Validate Glaze UI 2.2 Structure component contracts
        run: python3 scripts/validate_glaze_2_2_structure_components.py

      - name: Validate Glaze UI 2.2 Overlay component contracts
        run: python3 scripts/validate_glaze_2_2_overlay_components.py

      - name: Validate Glaze UI 2.2 Signature and Intelligence component contracts
        run: python3 scripts/validate_glaze_2_2_advanced_components.py

      - name: Validate Glaze UI 2.1 to 2.2 migration compatibility
        run: python3 scripts/validate_glaze_2_2_migration.py

      - name: Validate Glaze UI 2.2 performance and Glaze budget contract
        run: python3 scripts/validate_glaze_2_2_performance.py

      - name: Validate canonical release-state consistency
        run: python3 scripts/validate_release_state.py

      - name: Validate retained Glaze UI repository contracts
        run: python3 scripts/validate_glaze_ui.py

      - name: Validate rendered Glaze UI 2.2 System Shell reference
        run: python3 scripts/validate_glaze_2_2_rendered.py

      - name: Validate rendered Glaze UI 2.2 Foundation components
        run: python3 scripts/validate_glaze_2_2_components_rendered.py

      - name: Validate rendered Glaze UI 2.2 Structure components
        run: python3 scripts/validate_glaze_2_2_structure_rendered.py

      - name: Validate rendered Glaze UI 2.2 Overlay components
        run: python3 scripts/validate_glaze_2_2_overlay_rendered.py

      - name: Validate rendered Glaze UI 2.2 Signature and Intelligence components
        run: python3 scripts/validate_glaze_2_2_advanced_rendered.py

      - name: Validate rendered Glaze UI 2.2 Universal Search and Control Center runtime
        run: python3 scripts/validate_glaze_2_2_system_interactions_rendered.py

      - name: Validate rendered Glaze UI 2.2 performance and Glaze budget behavior
        run: python3 scripts/validate_glaze_2_2_performance_rendered.py

      - name: Render pinned Glaze UI 2.2 Candidate visual baseline source
        run: python3 .glaze-2.2-visual-baseline-source/scripts/glaze_2_2_visual_regression.py capture --output-dir ../.artifacts/glaze-2.2-visual-baseline-reference

      - name: Validate Glaze UI 2.2 source-pinned screenshot pixel regression
        run: python3 scripts/glaze_2_2_visual_regression.py compare --baseline-dir .artifacts/glaze-2.2-visual-baseline-reference --output-dir .artifacts/glaze-2.2-visual-regression

      - name: Stage verified exact-head Glaze UI 2.2 Candidate visual review set
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest = json.loads(Path("contracts/regression/visual-baselines-2.2.json").read_text(encoding="utf-8"))
          source = Path(".artifacts/glaze-2.2-visual-regression")
          target = Path(".artifacts/glaze-2.2-visual-review-current")
          target.mkdir(parents=True, exist_ok=True)
          cases = manifest.get("cases", [])
          if len(cases) != 6:
              raise SystemExit(f"expected six Glaze UI 2.2 review cases, found {len(cases)}")
          for case in cases:
              screenshot = source / f"{case['id']}.png"
              if not screenshot.is_file() or screenshot.stat().st_size < 256:
                  raise SystemExit(f"missing verified exact-head screenshot: {screenshot}")
              shutil.copy2(screenshot, target / screenshot.name)
          staged = sorted(target.glob("*.png"))
          if len(staged) != len(cases):
              raise SystemExit(f"expected {len(cases)} staged review screenshots, found {len(staged)}")
          print("Staged the exact six pixel-regression-passed screenshots for Human Visual Excellence review.")
          PY

      - name: Upload exact-head Glaze UI 2.2 Candidate visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glaze-ui-2.2-candidate-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/glaze-2.2-visual-review-current/*.png
            .artifacts/glaze-2.2-visual-baseline-reference/*.png
            .artifacts/glaze-2.2-visual-regression/*
          if-no-files-found: error
          retention-days: 14
