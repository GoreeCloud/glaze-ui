name: Patch Glaze Motion registry validation for 1.6

on:
  push:
    branches:
      - agent/glaze-ui-1.6-stable-promotion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[motion-registry-patch]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glaze-ui-1.6-stable-promotion
          persist-credentials: true
      - name: Reconcile historical Motion evidence with current Stable consumer registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_glaze_motion.py')
          body = path.read_text(encoding='utf-8')
          old = '''    registry = json.loads(REGISTRY.read_text(encoding="utf-8"))
    require(registry.get("stableBaseline") == "1.5.0", "consumer Stable baseline changed")
    for repo, merge in ((LAUNCHER_REPO, LAUNCHER_MERGE), (KEYBOARD_REPO, KEYBOARD_MERGE)):
        entry = registry_by_repo(registry, repo)
        require(entry.get("status") == "adoption-candidate", f"{repo} must remain Adoption Candidate")
        require(entry.get("targetVersion") == "1.5.0", f"{repo} must target current Stable")
        require(entry.get("referenceRevision") == merge, f"{repo} registry merge evidence changed")
'''
          new = '''    current_stable = (ROOT / "VERSION").read_text(encoding="utf-8").strip()
    registry = json.loads(REGISTRY.read_text(encoding="utf-8"))
    require(registry.get("stableBaseline") == current_stable, "consumer Stable baseline changed")
    for repo, merge in ((LAUNCHER_REPO, LAUNCHER_MERGE), (KEYBOARD_REPO, KEYBOARD_MERGE)):
        entry = registry_by_repo(registry, repo)
        require(entry.get("status") == "migration-required", f"{repo} must become Migration Required after Stable advances")
        require(entry.get("targetVersion") == "1.5.0", f"{repo} historical evaluated target changed")
        require(entry.get("requiredTargetVersion") == current_stable, f"{repo} required target must match current Stable")
        require(entry.get("referenceRevision") == merge, f"{repo} registry merge evidence changed")
'''
          if old not in body:
              raise SystemExit('Glaze Motion registry validation source drifted')
          path.write_text(body.replace(old, new), encoding='utf-8')
          PY
      - name: Commit validator reconciliation
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/validate_glaze_motion.py
          git commit -m "Reconcile Glaze Motion registry validation for 1.6 [motion-registry-patch]"
          git push origin HEAD:agent/glaze-ui-1.6-stable-promotion
