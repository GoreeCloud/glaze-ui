name: GLAZE UI V1.4.1 Stable Authority

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'README.md'
      - 'STABILITY.md'
      - 'CONSUMERS.md'
      - 'CONTRIBUTING.md'
      - 'CONFORMANCE.md'
      - 'ACCEPTANCE.md'
      - 'ADOPTION.md'
      - 'ENFORCEMENT.md'
      - 'ICON_CONSTRUCTION.md'
      - 'ICON_IDENTITY.md'
      - 'website/README.md'
      - 'GLAZE_UI_V1_4_1.md'
      - 'GLAZE_UI_V1_4_1_HARDENING.md'
      - 'acceptance/v1.4.1-stable.md'
      - 'css/glaze-v1.4.1.css'
      - 'css/glaze-v1.4.1.candidate.css'
      - 'js/glaze-v1.4.1.mjs'
      - 'js/glaze-v1.4.1-optical-engine.mjs'
      - 'js/glaze-v1.4.1-optical-engine.candidate.mjs'
      - 'registry/lifecycle.json'
      - 'consumers/registry.json'
      - 'scripts/verify_glaze_v1_4_1_stable.mjs'
      - 'scripts/verify_glaze_v1_4_stable.mjs'
      - 'scripts/validate_glaze_v1_2_documentation_versions.py'
      - 'scripts/validate_consumer_summary.py'
      - '.github/workflows/glaze-v1.4.1-stable.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'README.md'
      - 'STABILITY.md'
      - 'CONSUMERS.md'
      - 'GLAZE_UI_V1_4_1.md'
      - 'acceptance/v1.4.1-stable.md'
      - 'css/glaze-v1.4.1.css'
      - 'js/glaze-v1.4.1.mjs'
      - 'js/glaze-v1.4.1-optical-engine.mjs'
      - 'registry/lifecycle.json'
      - 'consumers/registry.json'
      - 'scripts/verify_glaze_v1_4_1_stable.mjs'
      - '.github/workflows/glaze-v1.4.1-stable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-authority:
    name: v1.4.1 Stable provenance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check js/glaze-v1.4.1.mjs
          node --check js/glaze-v1.4.1-optical-engine.mjs
          node --check scripts/verify_glaze_v1_4_1_stable.mjs
          node --check scripts/verify_glaze_v1_4_stable.mjs
          node --check scripts/verify_glaze_v1_4_1_human_validation.mjs
          node --check scripts/verify_glaze_v1_4_1_human_validation_schema.mjs

      - name: Verify immutable GitHub Actions pins
        run: python3 scripts/validate_github_actions_runtime_integrity.py

      - name: Verify active or historical V1.4.1 Stable authority
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_STABLE="$(node -p "require('./registry/lifecycle.json').currentStable")"
          if [[ "${CURRENT_STABLE}" == "1.4.1" ]]; then
            node scripts/verify_glaze_v1_4_1_stable.mjs
          else
            node -e "const a=require('node:assert/strict'),l=require('./registry/lifecycle.json'),v141=l.releases.find(x=>x.version==='1.4.1');a.ok(v141);a.equal(v141.status,'stable');a.equal(v141.consumerEligible,true);a.equal(v141.stableBaseline,'1.4.0');if(l.currentStable==='1.5.0'){const v150=l.releases.find(x=>x.version==='1.5.0');a.ok(v150);a.equal(v150.status,'stable');a.equal(v150.stableBaseline,'1.4.1')}console.log('V1.4.1 retained as historical Stable rollback provenance under current Stable '+l.currentStable+'.')"
          fi

      - name: Verify retained V1.4.0 historical authority
        run: node scripts/verify_glaze_v1_4_stable.mjs

      - name: Verify V1.4.1 optical runtime hardening
        run: node scripts/verify_glaze_v1_4_1_optical_runtime.mjs

      - name: Verify V1.4.1 evidence protocol integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify_glaze_v1_4_1_human_validation_schema.mjs
          CURRENT_STABLE="$(node -p "require('./registry/lifecycle.json').currentStable")"
          if [[ "${CURRENT_STABLE}" == "1.4.0" || "${CURRENT_STABLE}" == "1.4.1" ]]; then
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --source-only
            node scripts/verify_glaze_v1_4_1_human_validation.mjs --self-test
          else
            node -e "const a=require('node:assert/strict'),l=require('./registry/lifecycle.json'),v=l.releases.find(x=>x.version==='1.4.1');a.ok(v);a.equal(v.status,'stable');a.equal(v.qualification,'GLAZE_UI_V1_4_1_HARDENING.md');a.equal(v.acceptance,'acceptance/v1.4.1-stable.md');console.log('V1.4.1 human-validation contract retained as historical release provenance.')"
          fi

      - name: Verify lifecycle and current-authority documentation
        run: python3 scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Verify consumer target summary
        run: python3 scripts/validate_consumer_summary.py

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .

      - name: Record Stable provenance gate boundary
        run: |
          {
            echo '### GLAZE UI V1.4.1 Stable provenance gate'
            echo
            echo '- Historical V1.4.1 lifecycle provenance: **PASS**'
            echo '- Retained V1.4.0 provenance: **PASS**'
            echo '- V1.4.1 optical runtime integrity: **PASS**'
            echo '- V1.4.1 evidence-protocol integrity: **PASS**'
            echo '- Current lifecycle/documentation integrity: **PASS**'
            echo '- Consumer-target integrity: **PASS**'
            echo
            echo 'This gate preserves V1.4.1 as release/rollback provenance. It does not make V1.4.1 the current Stable release and does not manufacture human acceptance evidence.'
          } >> "${GITHUB_STEP_SUMMARY}"
