name: GLAZE UI V1.2 Stable

on:
  pull_request:
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "css/glaze-v1.2.0.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "tokens/glaze-v1.json"
      - "consumers/**"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  push:
    branches: [main]
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "css/glaze-v1.2.0.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "tokens/glaze-v1.json"
      - "consumers/**"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-stable-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate preserved V1.2 historical Stable authority
        run: python scripts/validate_glaze_v1_2_stable.py
      - name: Verify V1.2 remains historical rather than current-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lifecycle = json.loads(Path('registry/lifecycle.json').read_text(encoding='utf-8'))
          versions = {item.get('version'): item for item in lifecycle.get('releases', [])}
          assert versions.get('1.2.0', {}).get('status') == 'stable'
          assert lifecycle.get('currentStable') != '1.2.0-candidate'
          print(f"V1.2 historical Stable preserved; current Stable is {lifecycle.get('currentStable')}: PASS")
          PY
