name: GLAZE UI V1.2 Historical Stable Regression

on:
  pull_request:
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "css/glaze-v1.2.0.css"
      - "css/glaze-v1.2.0-candidate.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "GLAZE_UI_V1_1.md"
      - "acceptance/v1.1-stable.md"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  push:
    branches: [main]
    paths:
      - "registry/lifecycle.json"
      - "GLAZE_UI_V1_2.md"
      - "GLAZE_UI_V1_2_CANDIDATE.md"
      - "css/glaze-v1.2.0.css"
      - "css/glaze-v1.2.0-candidate.css"
      - "js/glaze-v1.2.0.mjs"
      - "acceptance/v1.2-stable.md"
      - "GLAZE_UI_V1_1.md"
      - "acceptance/v1.1-stable.md"
      - "scripts/validate_glaze_v1_2_stable.py"
      - ".github/workflows/glaze-v1.2-stable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-stable-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check historical validator syntax
        run: python -m py_compile scripts/validate_glaze_v1_2_stable.py
      - name: Verify preserved V1.2 Stable provenance
        run: python scripts/validate_glaze_v1_2_stable.py
