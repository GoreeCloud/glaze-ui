name: Glaze UI V1.6 Rendered Browser Qualification

on:
  pull_request:
    paths:
      - 'contracts/v1.6/qualification.rendered.plan.json'
      - 'schemas/v1.6-rendered-qualification-plan.schema.json'
      - 'reference/v1.6/rendered-qualification.html'
      - 'scripts/capture_glaze_v1_6_rendered_qualification.py'
      - 'scripts/validate_glaze_v1_6_rendered_qualification_harness.mjs'
      - 'js/glaze-v1.6-acceptance.dev.mjs'
      - 'acceptance/v1.6-machine-evidence.json'
      - 'acceptance/v1.6-rendered-evidence.json'
      - 'acceptance/v1.6-development.md'
      - 'schemas/v1.6-rendered-evidence.schema.json'
      - 'scripts/validate_glaze_v1_6_rendered_evidence_record.mjs'
      - '.github/workflows/glaze-v1.6-rendered-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-v1-6-rendered-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V16_SOURCE_SHA: c7509c79256b04b0aa67cb9dd0737d7588e0ae4a

jobs:
  verify-rendered-qualification-tooling:
    name: Verify V1.6 rendered qualification tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tooling revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "${V16_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$V16_SOURCE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Syntax-check rendered qualification tooling
        run: |
          node --check scripts/validate_glaze_v1_6_rendered_qualification_harness.mjs
          node --check scripts/validate_glaze_v1_6_rendered_evidence_record.mjs
          python -m py_compile scripts/capture_glaze_v1_6_rendered_qualification.py

      - name: Verify rendered qualification plan and authority boundaries
        run: node scripts/validate_glaze_v1_6_rendered_qualification_harness.mjs

      - name: Verify durable rendered evidence record
        run: node scripts/validate_glaze_v1_6_rendered_evidence_record.mjs

      - name: Preserve V1.6 acceptance-control behavior
        run: node scripts/validate_glaze_v1_6_acceptance_development.mjs

      - name: Preserve exact-source machine evidence integrity
        run: node scripts/validate_glaze_v1_6_machine_evidence_record.mjs

      - name: Preserve V1.5.1 Stable authority
        run: node scripts/verify_glaze_v1_5_1_stable.mjs

      - name: Verify validation did not mutate tracked source
        run: git diff --exit-code -- .

  capture-rendered-browser-evidence:
    name: Capture frozen-source V1.6 rendered browser evidence
    needs: verify-rendered-qualification-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out frozen V1.6 qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.V16_SOURCE_SHA }}
          path: _v16-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify source and tooling identities
        env:
          EXPECTED_TOOLING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TOOLING_SHA"
          test "$(git -C _v16-source rev-parse HEAD)" = "$V16_SOURCE_SHA"
          git -C _v16-source diff --exit-code -- .

      - name: Assemble local-only composite render root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _v16-render-root
          mkdir -p _v16-render-root/reference/v1.6
          cp -a _v16-source/js _v16-render-root/js
          cp -a _v16-source/css _v16-render-root/css
          cp reference/v1.6/rendered-qualification.html _v16-render-root/reference/v1.6/rendered-qualification.html
          test -f _v16-render-root/js/glaze-v1.6-development.mjs
          test -f _v16-render-root/css/glaze-v1.4.1.css
          test -f _v16-render-root/reference/v1.6/rendered-qualification.html

      - name: Capture exact-source rendered scenes
        run: |
          python scripts/capture_glaze_v1_6_rendered_qualification.py             --render-root _v16-render-root             --source-root _v16-source             --tooling-root .             --out artifacts/v1.6-rendered

      - name: Verify evidence boundaries and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('artifacts/v1.6-rendered/manifest.json').read_text())
          assert manifest['sourceRevision']=='c7509c79256b04b0aa67cb9dd0737d7588e0ae4a'
          assert manifest['acceptanceModelVersion']=='1.6.0-dev.12'
          assert manifest['stableBaseline']=='1.5.1'
          assert manifest['sceneCount']==9
          assert manifest['passed'] is True
          assert manifest['authority']['renderedBrowserOnly'] is True
          for key in (
              'humanEvidenceClaimed','assistiveTechnologyEvidenceClaimed','physicalDeviceEvidenceClaimed',
              'nativePlatformEvidenceClaimed','representativePerformanceEvidenceClaimed',
              'regressionBaselineClaimed','lifecyclePromotionAutomatic','stableStatusGranted',
              'consumerAcceptanceAutomatic','deploymentAcceptanceAutomatic','productionAcceptanceAutomatic'
          ):
              assert manifest['authority'][key] is False, key
          print('Rendered evidence manifest boundary verification: PASS')
          PY
          git -C _v16-source diff --exit-code -- .
          git diff --exit-code -- .

      - name: Upload rendered qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-v1.6-rendered-browser-${{ github.run_id }}
          path: artifacts/v1.6-rendered/
          if-no-files-found: error
          retention-days: 90
