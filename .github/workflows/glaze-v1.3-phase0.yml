name: GLAZE UI V1.3 Historical Integrity

on:
  pull_request:
    paths:
      - 'GLAZE_UI_V1_3.md'
      - 'contracts/v1.3/**'
      - 'acceptance/v1.3-**'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - '.github/workflows/glaze-v1.3-phase0.yml'
  push:
    branches: [main]
    paths:
      - 'GLAZE_UI_V1_3.md'
      - 'contracts/v1.3/**'
      - 'acceptance/v1.3-**'
      - 'scripts/validate_glaze_v1_3_phase0.py'
      - 'registry/lifecycle.json'
      - '.github/workflows/glaze-v1.3-phase0.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-v1-3-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile V1.3 historical validator
        run: python -m py_compile scripts/validate_glaze_v1_3_phase0.py
      - name: Validate preserved V1.3 Stable boundary
        run: python scripts/validate_glaze_v1_3_phase0.py
      - name: Validate V1.2 rollback record exists
        run: |
          python - <<'PY'
          import json
          lifecycle=json.load(open('registry/lifecycle.json',encoding='utf-8'))
          record=next((r for r in lifecycle.get('releases',[]) if r.get('version')=='1.2.0'),None)
          assert record and record.get('status')=='stable' and record.get('consumerEligible') is True
          print('Historical V1.2 rollback record: PASS')
          PY
      - name: Parse V1.3 planning contracts
        run: |
          python -m json.tool contracts/v1.3/adaptive-resonance.plan.json >/dev/null
          python -m json.tool contracts/v1.3/deferred-qualification.plan.json >/dev/null
