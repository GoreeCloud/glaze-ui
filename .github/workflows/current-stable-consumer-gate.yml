name: Glaze UI Current Stable Consumer Gate

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Repository-relative path to the consumer Glaze UI conformance manifest.
        required: false
        type: string
        default: .goreecloud/glaze-ui-conformance.json
      stable-claim:
        description: Enforce the stricter gate required before the caller may claim product Stable status.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  current-stable-glaze-ui:
    name: Current Stable Glaze UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact consumer source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: consumer

      - name: Check out current Glaze UI policy authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: main
          path: glaze-ui-policy

      - name: Validate current Stable Glaze UI conformance
        shell: bash
        env:
          CONSUMER_MANIFEST: ${{ inputs.manifest-path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          STABLE_CLAIM: ${{ inputs.stable-claim }}
        run: |
          set -euo pipefail
          if [[ -z "${CONSUMER_MANIFEST}" || "${CONSUMER_MANIFEST}" == /* ]]; then
            echo 'manifest-path must be a non-empty repository-relative path' >&2
            exit 1
          fi
          IFS='/' read -r -a manifest_parts <<< "${CONSUMER_MANIFEST}"
          for part in "${manifest_parts[@]}"; do
            if [[ "${part}" == '..' ]]; then
              echo 'manifest-path may not traverse outside the consumer repository' >&2
              exit 1
            fi
          done
          POLICY_REVISION="$(git -C glaze-ui-policy rev-parse HEAD)"
          args=(
            --manifest "consumer/${CONSUMER_MANIFEST}"
            --consumer-root consumer
            --repository "${EXPECTED_REPOSITORY}"
            --revision "${EXPECTED_REVISION}"
            --policy-revision "${POLICY_REVISION}"
            --report glaze-ui-current-stable-gate-report.json
          )
          if [[ "${STABLE_CLAIM}" == "true" ]]; then
            args+=(--stable-claim)
          fi
          python3 glaze-ui-policy/scripts/validate_downstream_current_stable.py "${args[@]}"

      - name: Upload exact-revision Glaze UI gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-ui-current-stable-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: glaze-ui-current-stable-gate-report.json
          if-no-files-found: warn
          retention-days: 30
