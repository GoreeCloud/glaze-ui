name: Glaze UI Lifecycle and Documentation Version Integrity

on:
  pull_request:
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CONFORMANCE.md"
      - "ACCEPTANCE.md"
      - "ADOPTION.md"
      - "ENFORCEMENT.md"
      - "CONSUMERS.md"
      - "ICON_CONSTRUCTION.md"
      - "ICON_IDENTITY.md"
      - "website/README.md"
      - "GLAZE_UI_V1_4.md"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - ".github/workflows/glaze-v1.2-documentation-version-integrity.yml"
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "registry/lifecycle.json"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CONFORMANCE.md"
      - "ACCEPTANCE.md"
      - "ADOPTION.md"
      - "ENFORCEMENT.md"
      - "CONSUMERS.md"
      - "ICON_CONSTRUCTION.md"
      - "ICON_IDENTITY.md"
      - "website/README.md"
      - "GLAZE_UI_V1_4.md"
      - "scripts/validate_glaze_v1_2_documentation_versions.py"
      - ".github/workflows/glaze-v1.2-documentation-version-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glaze-lifecycle-version-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-version-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact authority revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Audit current lifecycle and front-door documentation authority
        run: |
          python scripts/validate_glaze_v1_2_documentation_versions.py \
            --output "artifacts/glaze-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}.json"

      - name: Compile lifecycle-version validator
        run: python -m py_compile scripts/validate_glaze_v1_2_documentation_versions.py

      - name: Verify validator did not mutate tracked source
        run: git diff --exit-code

      - name: Upload exact-head lifecycle-version evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glaze-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/glaze-lifecycle-version-integrity-${{ github.event.pull_request.head.sha || github.sha }}.json
          if-no-files-found: error
          retention-days: 14
